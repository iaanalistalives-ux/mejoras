<!-- ============================================================================
     LIVES · SESIÓN DEL PORTAL EN LAS HERRAMIENTAS            lives-sesion v5.2 · 2026-10-06
     Bloque común: es idéntico en todas las herramientas. Si se corrige, se corrige en
     todas. No depende de nada de la página.
     · Toma la sesión del portal LIVES (misma dirección github.io, se comparte sola).
     · v4 · SIN BLOQUEO: la herramienta abre SIEMPRE. Ya no aparece "Abre esto desde el
       portal". Si hay sesión del portal, todo funciona como antes (nombre, llave,
       permisos, supervisión). Si no hay sesión (por ejemplo, abierta desde el portal de
       Sistemas), abre igual y lee con la clave pública.
     · Toda lectura a Supabase sale con la llave de la persona (si la hay) y la renueva
       antes de que venza (1 hora) sin chocar con el portal ni con otras pestañas.
     · El nombre de quien trabaja sale de la sesión: ?usuario= se reescribe con el real.
       Sin sesión, ?usuario= queda como venga en la dirección.
     · MODO SUPERVISIÓN (desde v3): Rodrigo (rcamogliano) ve y usa todo, nada se guarda.
       Christian (ctalepcio) tiene acceso completo. Solo aplica con sesión del portal.
     · v5 · PUENTE CON EL PORTAL DE SISTEMAS (temporal, riesgo aceptado por Christian el
       06/10/2026): si no hay sesión del portal LIVES y el link trae ?usuario=Nombre+Apellido,
       se pide a Supabase (función sesion-sistemas) la sesión de esa persona y la herramienta
       se recarga una vez ya con su nombre y sus permisos. El nombre no se verifica hasta que
       Sistemas firme el link. Esa sesión vive solo en la pestaña (no pasa al portal LIVES) y
       se descarta si el link trae otro nombre. Cuentas excluidas: las define Supabase.
     · v5.1 · NOMBRE AL DÍA: al abrir, se pregunta a Supabase el nombre vigente de quien
       tiene la sesión (mi_nombre). Si cambió (p. ej. por los nombres de Sistemas) se corrige
       la sesión guardada y la pantalla se recarga una sola vez con el nombre nuevo.
     · v5.2 · PORTAL NUEVO: el puente avisa si la herramienta está abierta dentro de
       app.lives.com.pe. Solo así Supabase acepta por el puente a Christian y a Rodrigo
       (Rodrigo siempre en supervisión). Con un link suelto, ellos no entran por el puente.
     ============================================================================ -->

<script id="lsJs">
(function(){
  'use strict';
  if (window.LIVES_SESION) return;                       /* por si el bloque quedara dos veces */

  var SB_URL  = 'https://xxfufpddgoyhbotjmaiy.supabase.co';
  var SB_KEY  = 'sb_publishable_1g-n6UT70EUlNAo8Lyc04w_jKR4LpXZ';
  var CLAVE   = 'lives_portal_sesion';                   /* misma llave que usa el portal */
  var CANDADO = 'lives_sb_renovando';
  var MOVIL   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  var GRACIA  = (MOVIL ? 720 : 60) * 60000;              /* igual que el portal */
  var fetchBase = window.fetch.bind(window);
  var yo = Math.random().toString(36).slice(2);

  /* ---------- guardar y leer la sesión (mismo formato que el portal) ---------- */
  function leerJ(area, k){ try{ return JSON.parse(area.getItem(k) || 'null'); }catch(e){ return null; } }
  function valida(d){
    return !!(d && d.token && d.permisos && d.sb && d.sb.access && d.sb.refresh);
  }

  /* La sesión vigente. Si hay dos copias (la de esta pestaña y el respaldo común) y son
     de la misma persona, se queda con la llave más nueva: otra pestaña o el portal pudo
     renovarla, y usar una llave ya renovada cierra la sesión en Supabase. */
  function sesion(){
    var s = null, r = null;
    try{ s = leerJ(sessionStorage, CLAVE); }catch(e){}
    try{
      var x = leerJ(localStorage, CLAVE + '_resp');
      if (x && valida(x.d) && (Date.now() - x.ts) < GRACIA) r = x.d;
    }catch(e){}
    if (!valida(s)) s = null;
    if (!s && r){ s = r; try{ sessionStorage.setItem(CLAVE, JSON.stringify(s)); }catch(e){} }
    if (s && r && r.usuario === s.usuario && r.sb && (!s.sb || r.sb.exp > s.sb.exp)){
      s.sb = r.sb;
      try{ sessionStorage.setItem(CLAVE, JSON.stringify(s)); }catch(e){}
    }
    return s;
  }
  function guardar(d){
    try{ sessionStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
    if (d && d.origen === 'sistemas') return;            /* sesión del puente: solo en esta pestaña */
    try{ localStorage.setItem(CLAVE + '_resp', JSON.stringify({ d: d, ts: Date.now() })); }catch(e){}
  }
  function borrar(){
    try{ sessionStorage.removeItem(CLAVE); }catch(e){}
    try{ localStorage.removeItem(CLAVE + '_resp'); }catch(e){}
  }
  /* Mientras se usa la herramienta, el respaldo cuenta desde la última actividad. */
  function refrescarMarca(){
    var s = sesion(); if (!s || s.origen === 'sistemas') return;
    try{ localStorage.setItem(CLAVE + '_resp', JSON.stringify({ d: s, ts: Date.now() })); }catch(e){}
  }
  setInterval(refrescarMarca, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refrescarMarca(); });

  function equipo(){
    var n = navigator.userAgent || '';
    var so = /Android/i.test(n) ? 'Android' : /iPhone|iPad/i.test(n) ? 'iPhone/iPad'
           : /Windows/i.test(n) ? 'Windows' : /Mac/i.test(n) ? 'Mac' : 'Otro';
    return so + (window.top === window ? ' · suelta' : '');
  }

  function pedir(ruta, cuerpo, token, ms){
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, ms || 15000);
    var cab = { 'Content-Type': 'application/json', apikey: SB_KEY };
    if (token) cab.Authorization = 'Bearer ' + token;
    return fetchBase(SB_URL + ruta, { method: 'POST', headers: cab, body: JSON.stringify(cuerpo || {}),
                                      cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function(r){
        clearTimeout(reloj);
        return r.text().then(function(t){
          var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
          return { status: r.status, ok: r.ok, json: j };
        });
      }, function(e){ clearTimeout(reloj); throw e; });
  }
  function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }

  /* ---------- llave vigente, renovada sin chocar con otras pestañas ---------- */
  var renovando = null;
  function llave(forzar){
    var s = sesion();
    if (!s || !s.sb || !s.sb.refresh) return Promise.resolve(null);
    if (!forzar && s.sb.exp - Date.now() > 60000) return Promise.resolve(s.sb.access);
    if (renovando) return renovando;
    var usada = s.sb.refresh;
    renovando = (function intento(n){
      var c = leerJ(localStorage, CANDADO);
      if (c && c.hasta > Date.now() && c.quien !== yo && n < 4){
        /* Otra pestaña o el portal está renovando: se espera y se usa lo que deje. */
        return esperar(1500).then(function(){
          var s2 = sesion();
          if (s2 && s2.sb && s2.sb.refresh !== usada && s2.sb.exp - Date.now() > 60000) return s2.sb.access;
          return intento(n + 1);
        });
      }
      try{ localStorage.setItem(CANDADO, JSON.stringify({ quien: yo, hasta: Date.now() + 10000 })); }catch(e){}
      return pedir('/auth/v1/token?grant_type=refresh_token', { refresh_token: usada })
        .then(function(r){
          if (r.ok && r.json && r.json.access_token){
            var s3 = sesion() || s;
            s3.sb = { access: r.json.access_token, refresh: r.json.refresh_token,
                      exp: Date.now() + (Number(r.json.expires_in) || 3600) * 1000 };
            guardar(s3);
            return s3.sb.access;
          }
          /* Rechazada: puede que otra pestaña la haya renovado un instante antes. */
          var s4 = sesion();
          if (s4 && s4.sb && s4.sb.refresh !== usada && s4.sb.exp - Date.now() > 60000) return s4.sb.access;
          /* v5: si la sesión del puente ya no se puede renovar, se descarta para que la
             próxima vez que se abra una herramienta el puente la vuelva a pedir. */
          if (r.status >= 400 && r.status < 500 && s.origen === 'sistemas'){
            borrar(); try{ sessionStorage.removeItem('lives_puente_recargado'); }catch(e){}
          }
          return null;
        }, function(){ return null; })                                             /* sin señal */
        .then(function(tk){
          try{ var c2 = leerJ(localStorage, CANDADO); if (c2 && c2.quien === yo) localStorage.removeItem(CANDADO); }catch(e){}
          return tk;
        });
    })(0).then(function(tk){ renovando = null; return tk; }, function(){ renovando = null; return null; });
    return renovando;
  }

  /* ---------- toda lectura a Supabase sale con la llave de la persona ---------- */
  function conLlave(init, tk){
    var o = {}, k;
    init = init || {};
    for (k in init) o[k] = init[k];
    var h = {};
    if (init.headers && typeof init.headers.forEach === 'function' && !(init.headers instanceof Array)){
      init.headers.forEach(function(v, n){ h[n] = v; });
    } else if (init.headers){
      for (k in init.headers) h[k] = init.headers[k];
    }
    var tiene = false;
    for (k in h) if (k.toLowerCase() === 'authorization') tiene = true;
    if (!tiene && tk) h.Authorization = 'Bearer ' + tk;
    var tieneKey = false;
    for (k in h) if (k.toLowerCase() === 'apikey') tieneKey = true;
    if (!tieneKey) h.apikey = SB_KEY;
    o.headers = h;
    return o;
  }

  /* ---------- MODO SUPERVISIÓN (desde v3) ---------- */
  /* Solo Rodrigo supervisa. Christian (ctalepcio) tiene acceso completo y guarda en
     todas las herramientas (lo da Supabase con es_superusuario()). */
  var SUPERVISORES = ['rcamogliano'];
  function supervisando(){
    var s = sesion(); if (!s) return false;
    return SUPERVISORES.indexOf(String(s.usuario || '').trim().toLowerCase()) !== -1;
  }
  /* El bloqueo de verdad lo hace Supabase: para los supervisores, todo pedido que intenta
     guardar corre en modo "solo lectura" y la base lo rechaza (y los archivos tampoco se
     suben). Aquí solo se deja la pantalla activa y se avisa con claridad. */
  var RPC_PUEDE = /(puede|permiso|es_editor|editor_de)/i;
  function rutaSB(url){ return url.indexOf(SB_URL) === 0 ? url.slice(SB_URL.length).split('?')[0] : ''; }
  function esRechazoSup(txt){ return /read-only transaction|solo lectura|SUPERVISION/i.test(txt || ''); }
  var _toastT = null;
  function avisoSup(txt){
    function poner(){
      var t = document.getElementById('lsToast');
      if (!t){ t = document.createElement('div'); t.id = 'lsToast'; document.body.appendChild(t); }
      t.textContent = txt; t.style.display = 'block';
      clearTimeout(_toastT); _toastT = setTimeout(function(){ t.style.display = 'none'; }, 4500);
    }
    if (document.body) poner(); else document.addEventListener('DOMContentLoaded', poner);
  }
  function marcaSup(){
    if (!supervisando() || document.getElementById('lsSup')) return;
    var b = document.createElement('div'); b.id = 'lsSup';
    b.textContent = '👁️ Modo supervisión · puedes usar todo, nada se guarda';
    document.body.appendChild(b);
  }
  if (document.body) marcaSup(); else document.addEventListener('DOMContentLoaded', marcaSup);
  function respuesta(cuerpo, estado){
    return new Response(JSON.stringify(cuerpo), { status: estado,
      headers: { 'Content-Type': 'application/json' } });
  }

  /* Para supervisores: "¿puede editar?" pasa a sí, y los rechazos por solo lectura se
     convierten en un aviso claro. Todo lo demás pasa igual que siempre. */
  function ajustarSup(r, url, metodo){
    if (!supervisando()) return r;
    var ruta = rutaSB(url);
    if (!ruta) return r;
    var esRpc = ruta.indexOf('/rest/v1/rpc/') === 0;
    var fn = esRpc ? ruta.slice('/rest/v1/rpc/'.length) : '';
    if (!r.ok){
      return r.clone().text().then(function(t){
        var sube = ruta.indexOf('/storage/v1/object') === 0 && !/\/object\/(list|sign|info)\//.test(ruta) &&
                   String(metodo).toUpperCase() !== 'GET';
        if (esRechazoSup(t) || sube){
          avisoSup('👁️ Modo supervisión: no se guardó. Estás revisando, los datos no cambian.');
          return respuesta({ message: 'Modo supervisión: no se guardó (estás revisando).',
                             error: 'MODO_SUPERVISION', code: 'SUPERVISION' }, r.status);
        }
        return r;
      }, function(){ return r; });
    }
    if (!esRpc) return r;
    return r.clone().text().then(function(t){
      var x = t.trim();
      if (RPC_PUEDE.test(fn) && (x === 'false' || x === '')) return respuesta(true, 200);
      if (x.charAt(0) === '{' && /"(puede|es_editor|editor)[a-z_]*"\s*:\s*false/i.test(x)){
        try{
          var o = JSON.parse(x), k, cambio = false;
          for (k in o) if (/^(puede|es_editor|editor)/i.test(k) && o[k] === false){ o[k] = true; cambio = true; }
          if (cambio) return respuesta(o, r.status);
        }catch(e){}
      }
      return r;
    }, function(){ return r; });
  }

  /* ---------- sin sesión: solo se anota en la consola, nunca se bloquea ---------- */
  var anotado = false;
  function sinSesion(){
    if (anotado) return;
    anotado = true;
    try{ console.info('[lives-sesion v5.2] Sin sesión del portal LIVES: se usa la clave pública.'); }catch(e){}
  }

  window.fetch = function(entrada, init){
    var url = (typeof entrada === 'string') ? entrada
            : (entrada && entrada.url) ? entrada.url : String(entrada || '');
    var metodo = (init && init.method) || (entrada && entrada.method) || 'GET';
    if (supervisando() && url.indexOf(SB_URL) === 0 && url.indexOf(SB_URL + '/rest/v1/') !== 0){
      return fetchBase(entrada, init).then(function(r){ return ajustarSup(r, url, metodo); });
    }
    if (typeof entrada !== 'string' || url.indexOf(SB_URL + '/rest/v1/') !== 0) return fetchBase(entrada, init);
    return esperaPuente().then(function(){ return llave(false); }).then(function(tk){
      if (!tk) sinSesion();
      return fetchBase(url, conLlave(init, tk)).then(function(r){
        if (r.status !== 401 || !tk) return ajustarSup(r, url, metodo);
        /* 401 con llave: venció o la cerraron. Se renueva una vez y se reintenta. */
        return llave(true).then(function(tk2){
          if (!tk2){ sinSesion(); return r; }
          return fetchBase(url, conLlave(init, tk2)).then(function(r2){
            return ajustarSup(r2, url, metodo);
          });
        });
      });
    });
  };

  /* ---------- el nombre sale de la sesión, no de la dirección ---------- */
  function fijarNombre(s){
    if (!s || !s.nombre) return;
    try{
      var u = new URL(location.href);
      if (u.searchParams.get('usuario') !== s.nombre){
        u.searchParams.set('usuario', s.nombre);
        u.searchParams.delete('nombre');
        history.replaceState(history.state, '', u.toString());
      }
    }catch(e){}
  }

  /* ---------- v5 · puente con el portal de Sistemas ---------- */
  var PUENTE_OK = 'lives_puente_recargado';
  function norm(x){
    return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[+._-]/g, ' ')
             .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function nombreLink(){
    try{ var u = new URL(location.href); return (u.searchParams.get('usuario') || u.searchParams.get('nombre') || '').trim(); }
    catch(e){ return ''; }
  }
  var pedido = nombreLink();
  var sx = sesion();
  /* Sesión del puente de otra persona (computadora compartida): se descarta. */
  if (sx && sx.origen === 'sistemas' && pedido && norm(pedido) !== norm(sx.nombre)){ borrar(); sx = null; }
  var puente = null;
  function enPortalNuevo(){
    if (window.top === window) return false;
    var anc = '';
    try{ var ao = location.ancestorOrigins; if (ao && ao.length) anc = ao[ao.length - 1]; }catch(e){}
    var ref = ''; try{ ref = document.referrer || ''; }catch(e){}
    return /^https:\/\/app\.lives\.com\.pe(\/|$)/.test(anc) || /^https:\/\/app\.lives\.com\.pe(\/|$)/.test(ref);
  }
  function esperaPuente(){ return puente || Promise.resolve(); }
  if (!sx && pedido && norm(pedido).length >= 5){
    var yaRecargo = null; try{ yaRecargo = sessionStorage.getItem(PUENTE_OK); }catch(e){}
    if (yaRecargo !== norm(pedido)){
      var raiz = document.documentElement, oculto = false;
      try{ raiz.style.visibility = 'hidden'; oculto = true; }catch(e){}
      var mostrar = function(){ if (oculto){ try{ raiz.style.visibility = ''; }catch(e){} oculto = false; } };
      var tope = setTimeout(mostrar, 6000);                 /* nunca deja la pantalla en blanco */
      puente = (function(){
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
        return fetchBase(SB_URL + '/functions/v1/sesion-sistemas', {
          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
          body: JSON.stringify({ nombre: pedido, equipo: equipo(), desde: location.pathname, portal_nuevo: enPortalNuevo() }),
          cache: 'no-store', signal: ctl ? ctl.signal : undefined
        }).then(function(r){ clearTimeout(reloj); return r.json(); })
          .then(function(j){
            if (!j || !j.ok || !j.sesion || !j.sesion.sb){ sinSesion(); mostrar(); clearTimeout(tope); return; }
            var d = j.sesion;
            d.sb = { access: d.sb.access, refresh: d.sb.refresh, exp: Date.now() + (Number(d.sb.expira_en) || 3600) * 1000 };
            d.vsesion = null;
            guardar(d);
            try{ sessionStorage.setItem(PUENTE_OK, norm(pedido)); }catch(e){}
            location.reload();                               /* se vuelve a abrir ya con su sesión */
          }, function(){ clearTimeout(reloj); sinSesion(); mostrar(); clearTimeout(tope); });
      })();
    }
  }

  /* ---------- al abrir ---------- */
  var s0 = sesion();
  if (!s0){
    sinSesion();
  } else {
    fijarNombre(s0);
    /* Si alguien ejecutó cerrar_todas_las_sesiones(), esta sesión ya no vale: se descarta
       y la herramienta sigue abierta sin sesión. Sin señal no se hace nada. */
    pedir('/rest/v1/rpc/version_sesion', {}, null, 8000).then(function(v){
      if (!v.ok || typeof v.json !== 'number') return;
      var s = sesion(); if (!s) return;
      if (s.vsesion === undefined || (s.vsesion !== null && s.vsesion !== v.json)){ borrar(); sinSesion(); return; }
      if (s.vsesion === null){ s.vsesion = v.json; guardar(s); }
    }).catch(function(){});
    /* v5.1: el nombre de la sesión se pone al día con el de la base (una recarga, una vez). */
    llave(false).then(function(tk){
      if (!tk) return;
      return pedir('/rest/v1/rpc/mi_nombre', {}, tk, 8000).then(function(v){
        if (!v.ok || typeof v.json !== 'string' || !v.json) return;
        var s = sesion(); if (!s || v.json === s.nombre) return;
        s.nombre = v.json; guardar(s); fijarNombre(s);
        var ya = null; try{ ya = sessionStorage.getItem('lives_nombre_al_dia'); }catch(e){}
        if (ya !== v.json){
          try{ sessionStorage.setItem('lives_nombre_al_dia', v.json); }catch(e){}
          location.reload();
        }
      });
    }).catch(function(){});
    /* Abierta fuera del portal: se anota igual que cuando se abre desde el portal. */
    if (window.top === window && s0.sb){
      document.addEventListener('DOMContentLoaded', function(){
        llave(false).then(function(tk){
          if (!tk) return;
          return pedir('/rest/v1/rpc/registrar_apertura',
            { p_herramienta: (document.title || location.pathname) + ' (suelta)',
              p_url: location.origin + location.pathname, p_equipo: equipo() }, tk, 10000);
        }).catch(function(){});
      });
    }
  }

  window.LIVES_SESION = {
    version: 'lives-sesion v5.2 · 2026-10-06 (sin bloqueo · nombre al día · supervisión · puente Sistemas · portal nuevo)',
    supervision: function(){ return supervisando(); },
    actual: function(){ var s = sesion(); return s ? { usuario: s.usuario, nombre: s.nombre, conSupabase: !!s.sb } : null; },
    llave: function(){ return llave(false); },
    pedir: function(){ sinSesion(); }       /* se mantiene por compatibilidad: ya no bloquea */
  };
})();
</script>
<!-- ===== fin lives-sesion v5.2 ===== -->

.bar label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--stone);}

.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:8px 14px;
cursor:pointer;border:1px solid var(--warm);background:#fff;color:var(--sage);}

.spacer{margin-left:auto;}
.hstate{font-size:11.5px;color:var(--stone);text-align:right;}

/* ---- banda de veredicto ---- */
.verdict{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--r);
box-shadow:var(--sh);padding:16px 20px;margin-bottom:14px;border-left:6px solid var(--rose);}
.verdict .dot{width:44px;height:44px;border-radius:50%;background:#FCEBEB;color:var(--rose);
display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none;}
.verdict .t{font-size:19px;font-weight:700;color:var(--rose);line-height:1.2;}
.verdict .s{font-size:13px;color:#333;margin-top:3px;}
.verdict.ok{border-left-color:var(--sage);}
.verdict.ok .dot{background:#E7F4EF;color:var(--sage);} .verdict.ok .t{color:var(--sage);}
.verdict.warn{border-left-color:var(--tan);}
.verdict.warn .dot{background:#FEF3E2;color:var(--taupe);} .verdict.warn .t{color:var(--taupe);}

/* ---- KPIs ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;
position:relative;overflow:hidden;transition:box-shadow .15s,transform .15s;}
.kpi:hover{box-shadow:var(--sh-h);transform:translateY(-1px);}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sage);}
.kpi.alert::after{background:var(--rose);}
.kpi.warn::after{background:var(--tan);}
.kpi.neu::after{background:var(--slate);}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--stone);}
.kpi .row{display:flex;align-items:baseline;gap:8px;margin-top:5px;}
.kpi .v{font-size:32px;font-weight:700;line-height:1;color:var(--sage);}
.kpi.alert .v{color:var(--rose);}
.kpi.warn .v{color:var(--taupe);}
.kpi.neu .v{color:var(--slate);}
.kpi .s{font-size:11.5px;color:var(--stone);margin-top:3px;}

/* ---- insight ---- */
.insight{background:var(--card);border-left:4px solid var(--tan);border-radius:0 var(--r) var(--r) 0;
box-shadow:var(--sh);padding:12px 16px;margin-bottom:16px;font-size:13.5px;}
.insight b{color:var(--sage-dark);}

/* ---- pestañas ---- */
.tabpane{display:none;} .tabpane.active{display:block;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--warm);margin:22px 0 14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:700;
color:var(--stone);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
.tabs button:hover{color:var(--sage);}
.tabs button.active{color:var(--sage-dark);border-bottom-color:var(--sage);}

/* ---- grilla y paneles ---- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
.col12{grid-column:span 12;} .col8{grid-column:span 8;}
.col6{grid-column:span 6;} .col4{grid-column:span 4;}
@media(max-width:1100px){.col8,.col6,.col4{grid-column:span 12;}}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;}

.panel .ph{font-size:11.5px;color:var(--stone);margin-top:2px;margin-bottom:12px;}

/* ---- gráficos ---- */
.cwrap{position:relative;width:100%;height:clamp(220px,26vh,320px);}
.cwrap.tall{height:clamp(260px,34vh,400px);}
.cwrap.xtall{height:clamp(380px,52vh,560px);}

/* ---- ranking ---- */
.rank{list-style:none;margin:0;padding:0;}
.rank li{display:grid;grid-template-columns:24px 1fr 62px;align-items:center;gap:10px;
padding:9px 0;border-bottom:1px solid var(--warm-light);}

.rank .n{width:24px;height:24px;border-radius:50%;background:var(--warm-light);color:var(--stone);
font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.rank .nm{font-size:13px;font-weight:700;}
.rank .sub{font-size:10.5px;color:var(--stone);font-weight:400;}
.rank .track{height:7px;background:var(--warm-light);border-radius:4px;margin-top:5px;overflow:hidden;}

.rank .val{text-align:right;font-size:15px;font-weight:700;}

/* ---- tabla ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
color:var(--stone);border-bottom:1px solid var(--warm);padding:8px 6px;}
td{padding:8px 6px;border-bottom:1px solid var(--warm-light);vertical-align:top;}
tr:hover td{background:var(--warm-light);}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.pill.ok{background:#E7F4EF;color:var(--sage);}
.pill.warn{background:#FEF3E2;color:var(--taupe);}
.pill.bad{background:#FCEBEB;color:var(--rose);}
.pill.neu{background:var(--warm-light);color:var(--stone);}
.busca{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--warm);
border-radius:8px;padding:9px 12px;margin-bottom:12px;}
.gris{color:#9aa8a4;}

/* ---- dual ---- */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dcell{background:var(--warm-light);border-radius:10px;padding:16px;text-align:center;}
.dcell .dv{font-size:30px;font-weight:700;color:var(--sage);line-height:1.1;}
.dcell .dl{font-size:12px;color:var(--stone);margin-top:3px;}
.note{margin-top:12px;background:var(--card);border-left:4px solid var(--tan);
border-radius:0 8px 8px 0;padding:10px 13px;font-size:12px;color:#333;line-height:1.5;}

/* ---- ayuda ---- */
details.help{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
padding:12px 16px;margin-top:18px;font-size:13px;}
details.help summary{cursor:pointer;font-weight:700;color:var(--sage-dark);}
details.help dt{font-weight:700;font-size:12.5px;color:#333;margin-top:11px;}
details.help dd{margin:2px 0 0;font-size:12.5px;color:var(--stone);line-height:1.5;}

.load{text-align:center;padding:60px 20px;color:var(--stone);}
.err{background:#FBE9E9;border:1px solid var(--rose);border-radius:8px;
padding:14px 18px;color:var(--rose);font-size:13px;}

/* ===== TABLET (hasta 900px) ===== */
@media(max-width:900px){
  .wrap{padding:14px 14px 36px;}
  .col12,.col8,.col6,.col4{grid-column:span 12;}
  .kpis{grid-template-columns:repeat(2,1fr);}

@media print{

}

<body>
<div class="wrap" id="app"><div class="load">Cargando datos del Círculo de Mejoras…</div></div>
<script>
/* ================================================================
   DATOS EN SUPABASE (28/09/2026) — ya no hay Apps Script ni Sheet.
   Todo pasa con la sesión del portal (bloque lives-sesion).
   ================================================================ */
var SB='https://xxfufpddgoyhbotjmaiy.supabase.co';
var SBK='sb_publishable_1g-n6UT70EUlNAo8Lyc04w_jKR4LpXZ';
var BUCKET='mejoras';
var API='supabase';

function txtErr(e){
  if(e==null)return 'error desconocido';
  if(typeof e==='string')return e;
  if(e.name==='TypeError'||/fetch|network/i.test(String(e.message||'')))return 'Sin conexión con la base de datos';
  return e.message||String(e);
}
function conTiempo(p,ms){
  return new Promise(function(ok,no){
    var t=setTimeout(function(){no('La base de datos no respondió a tiempo');},ms);
    p.then(function(v){clearTimeout(t);ok(v);},function(e){clearTimeout(t);no(e);});
  });
}
/* una llamada a una función de Supabase; la llave la pone el bloque de sesión */
function rpc(fn,args,ms){
  return conTiempo(fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(args||{})}),ms||30000)
    .then(function(r){
      return r.text().then(function(t){
        var j=null;try{j=t?JSON.parse(t):null;}catch(x){}
        if(!r.ok){
          if(r.status===401)throw 'La sesión venció. Vuelve a entrar desde el portal.';
          throw (j&&(j.message||j.error))||('error '+r.status);
        }
        return j;
      });
    });
}
/* lectura: si falla la red, un reintento y luego se avisa (nunca queda bloqueada) */
function rpcLeer(fn,args){
  return rpc(fn,args).catch(function(e){
    var m=txtErr(e);
    if(/permiso|sesión/i.test(m))throw m;
    return new Promise(function(ok){setTimeout(ok,1500);}).then(function(){return rpc(fn,args);});
  });
}
var META=100;   /* meta declarada: 100 % de avance */

var ESCALA=[{p:0,c:'No iniciado'},{p:0.3,c:'Solicitud realizada'},{p:0.5,c:'Pedido en gestión'},
            {p:0.7,c:'Confirmado por proveedor'},{p:1,c:'Entregado / cerrado'}];
var COL_ESC=['#C9D6D2','#F59E0B','#B45309','#4E6B78','#0F7A5A'];
var C_CERR='#0F7A5A', C_CURSO='#F59E0B', C_NADA='#C9D6D2', C_MAL='#DC2626', C_AZUL='#4E6B78';
var M=[],E=[],TAB=0,AREA='',CHARTS=[];

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function estadoDe(p){for(var i=0;i<ESCALA.length;i++)if(Math.abs(ESCALA[i].p-p)<0.001)return ESCALA[i].c;return '—';}
function n1(x){return (Math.round(x*10)/10).toLocaleString('es-PE');}
function hoyISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dias(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function corto(s,n){s=String(s||'');return s.length>n?s.substring(0,n-1)+'…':s;}

/* semáforo único: la meta es llegar al 100 %, así que aquí SUBIR ES BUENO.
   En meta → verde. Hasta 20 puntos por debajo → ámbar. Más abajo → rojo. */
function sem(p){return p>=META?'#0F7A5A':(p>=META*0.8?'#F59E0B':'#DC2626');}
function semClase(p){return p>=META?'ok':(p>=META*0.8?'warn':'bad');}
function semKpi(p){return p>=META?'':(p>=META*0.8?'warn':'alert');}

/* lectura en Supabase, mismo formato que devolvía el Apps Script */
function jsonp(params,cb,err){
  var p;
  if(params.accion==='mejoras')p=rpcLeer('mejoras_listar').then(function(l){return {ok:true,mejoras:l||[]};});
  else if(params.accion==='evidencias')p=rpcLeer('mejoras_evidencias_listar').then(function(l){return {ok:true,evidencias:l||[]};});
  else p=Promise.resolve({ok:false,error:'Acción desconocida: '+params.accion});
  p.then(function(r){cb(r);},function(e){err&&err(txtErr(e));});
}

if(typeof Chart!=='undefined'){
  Chart.defaults.font.family='Calibri, Arial, sans-serif';
  Chart.defaults.font.size=12;
  Chart.defaults.color='#5F726C';
  Chart.defaults.borderColor='#F1F6F4';
  Chart.defaults.maintainAspectRatio=false;
  Chart.defaults.plugins.tooltip.backgroundColor='rgba(14,59,54,.95)';
  Chart.defaults.plugins.tooltip.padding=10;
  Chart.defaults.plugins.tooltip.cornerRadius=6;
  Chart.defaults.plugins.legend.position='bottom';
  Chart.defaults.plugins.legend.labels.usePointStyle=true;
  Chart.defaults.plugins.legend.labels.boxWidth=12;
  Chart.defaults.plugins.legend.labels.padding=14;
  if(window.matchMedia('(max-width:600px)').matches){
    Chart.defaults.font.size=11;
    Chart.defaults.plugins.legend.labels.boxWidth=10;
  }
}
/* la skill pide el valor al final de la barra, fuera de ella */
var etiquetaBarra={
  id:'etiquetaBarra',
  afterDatasetsDraw:function(ch,args,opts){
    if(!opts||!opts.on)return;
    var g=ch.ctx, suf=opts.suf||'';
    g.save();
    g.font='700 11px Calibri, Arial, sans-serif';
    g.fillStyle='#333';
    g.textBaseline='middle';
    ch.data.datasets.forEach(function(ds,di){
      var meta=ch.getDatasetMeta(di);
      if(meta.hidden)return;
      meta.data.forEach(function(barra,i){
        var v=ds.data[i];
        if(v===null||v===undefined)return;
        var txt=(opts.dec===0?Math.round(v):Math.round(v*10)/10).toLocaleString('es-PE')+suf;
        g.fillText(txt,barra.x+7,barra.y);
      });
    });
    g.restore();
  }
};
if(typeof Chart!=='undefined')Chart.register(etiquetaBarra);

function limpiarCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
function mk(id,cfg){var el=$(id);if(!el||typeof Chart==='undefined')return;CHARTS.push(new Chart(el,cfg));}

/* contador animado del KPI */
function countUp(el){
  var end=+el.dataset.count, dec=+el.dataset.dec||0, suf=el.dataset.suf||'';
  var t0=performance.now();
  (function step(t){
    var k=Math.min((t-t0)/900,1), e=1-Math.pow(1-k,3);
    el.textContent=(end*e).toLocaleString('es-PE',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
    if(k<1)requestAnimationFrame(step);
  })(t0);
}

var REI=0;
function cargarDatos(){
  $('app').innerHTML='<div class="load">Cargando datos del Círculo de Mejoras…</div>';
  jsonp({accion:'mejoras'},function(r){
    if(!r.ok){$('app').innerHTML='<div class="err">Error al leer los datos: '+esc(r.error)+'</div>';return;}
    REI=0;M=r.mejoras||[];render();
    jsonp({accion:'evidencias'},function(r2){if(r2&&r2.ok){E=r2.evidencias||[];render();}},function(){});
  },function(e){
    if(REI<1){REI++;$('app').innerHTML='<div class="load">La conexión falló. Reintentando…</div>';
      setTimeout(cargarDatos,2500);return;}
    var enApp=/FBAN|FBAV|Instagram|Line|WhatsApp|Micromessenger/i.test(navigator.userAgent);
    $('app').innerHTML='<div class="err"><b>No se pudo conectar con la base de datos.</b> '+esc(e)+
      '<div style="margin-top:10px;font-weight:400;line-height:1.6">'+
      (enApp?'Parece que abriste el enlace dentro de otra aplicación. Toca los tres puntos y elige «Abrir en Chrome».<br>':'')+
      'Revisa la señal. Si el mensaje dice que no tienes permiso, pide acceso al Círculo de Mejoras en el portal.</div>'+
      '<div style="margin-top:12px"><button class="btn" onclick="REI=0;cargarDatos()">Reintentar</button></div></div>';
  });
}

/* ================= cálculos (idénticos a la versión anterior) ================= */
function datos(){
  var f=AREA?M.filter(function(m){return m.area===AREA;}):M;
  var n=f.length,suma=0,cerr=0,proc=0,nini=0;
  f.forEach(function(m){suma+=m.pct;if(m.pct>=1)cerr++;else if(m.pct>0)proc++;else nini++;});
  var ids={};E.forEach(function(x){ids[x.idMejora]=1;});
  var conFoto=f.filter(function(m){return ids[m.id];}).length;
  var rev=f.filter(function(m){return m.revisar==='SI';}).length;
  var reprog=f.filter(function(m){return (m.vecesReprog||0)>0;}).length;
  var hoy=hoyISO();
  var venc=f.filter(function(m){var fc=(m.fechaCierre||'').substring(0,10);
    return fc&&fc<hoy&&m.pct<1;}).length;
  var nAntes=0,nDesp=0;
  E.forEach(function(x){if(x.tipo==='DESPUES')nDesp++;else nAntes++;});
  return {f:f,n:n,suma:suma,avance:n?suma/n*100:0,cerr:cerr,proc:proc,nini:nini,
          conFoto:conFoto,rev:rev,fotos:E.length,reprog:reprog,venc:venc,
          nAntes:nAntes,nDesp:nDesp};
}

function porArea(){
  var g={},hoy=hoyISO();
  var ids={};E.forEach(function(x){ids[x.idMejora]=1;});
  M.forEach(function(m){
    if(!g[m.area])g[m.area]={n:0,s:0,c:0,p:0,z:0,v:0,f:0,r:0};
    var a=g[m.area];a.n++;a.s+=m.pct;
    if(m.pct>=1)a.c++;else if(m.pct>0)a.p++;else a.z++;
    var fc=(m.fechaCierre||'').substring(0,10);
    if(fc&&fc<hoy&&m.pct<1)a.v++;
    if(ids[m.id])a.f++;
    if((m.vecesReprog||0)>0)a.r++;
  });
  return Object.keys(g).map(function(a){var x=g[a];
    return {area:a,n:x.n,cerr:x.c,curso:x.p,nada:x.z,venc:x.v,foto:x.f,reprog:x.r,
            avance:x.s/x.n*100,pctFoto:x.f/x.n*100};
  }).sort(function(x,y){return y.avance-x.avance;});
}

function vencidasList(){
  var hoy=hoyISO();
  return (AREA?M.filter(function(m){return m.area===AREA;}):M)
    .filter(function(m){var fc=(m.fechaCierre||'').substring(0,10);return fc&&fc<hoy&&m.pct<1;})
    .map(function(m){m._d=dias(m.fechaCierre.substring(0,10),hoy);return m;})
    .sort(function(a,b){return b._d-a._d;});
}

/* ================= render ================= */
function render(){
  limpiarCharts();
  var d=datos(), pa=porArea();
  var amb=AREA?('en '+AREA):'en las 16 áreas';

  /* --- banda de veredicto (hay meta declarada: 100 %) --- */
  var cls=semClase(d.avance), falta=META-d.avance;
  var titulo = cls==='ok' ? 'En meta' : (cls==='warn' ? 'Al límite' : 'Fuera de meta');
  var icono  = cls==='ok' ? '✓' : (cls==='warn' ? '!' : '!');
  var vcls   = cls==='ok' ? 'ok' : (cls==='warn' ? 'warn' : '');
  var abiertas=d.proc+d.nini;
  var frase='El avance '+amb+' es de <b>'+n1(d.avance)+'%</b> frente a la meta de '+META+'%: '+
            'faltan <b>'+n1(falta)+' puntos</b>, que equivalen a <b>'+abiertas+'</b> mejora'+
            (abiertas===1?'':'s')+' todavía sin cerrar de '+d.n+'.';

  /* --- KPIs --- */
  var pctCerr=d.n?d.cerr/d.n*100:0, pctFoto=d.n?d.conFoto/d.n*100:0;

  /* --- insight --- */
  var top=pa.slice(0,3), sumaTop=0; top.forEach(function(x){sumaTop+=x.cerr;});
  var peor=pa.slice(-1)[0];
  var ins;
  if(d.venc>0){
    ins='<b>Lo que más pesa:</b> '+d.venc+' mejoras ya pasaron la fecha que su área se comprometió a cumplir y siguen abiertas'+
        (peor&&!AREA?', y el área más rezagada es <b>'+esc(peor.area)+'</b>, con '+n1(peor.avance)+'% sobre '+peor.n+' ideas':'')+
        '. Si esas '+d.venc+' se cerraran, el avance global subiría a <b>'+
        n1(d.n?(d.suma+d.venc*0.5)/d.n*100:0)+'%</b> aproximadamente.';
  }else{
    ins='<b>Lo que más pesa:</b> solo '+n1(pctFoto)+'% de las ideas tiene evidencia cargada ('+d.conFoto+' de '+d.n+'). '+
        'Sin foto, que una mejora esté cerrada depende de lo que declara cada área.';
  }

  var areas=[''].concat(pa.map(function(x){return x.area;}));
  var sel='<select onchange="setArea(this.value)">'+areas.map(function(a){
    return '<option value="'+esc(a)+'"'+(a===AREA?' selected':'')+'>'+(a?esc(a):'Todas las áreas')+'</option>';}).join('')+'</select>';

  var h='';
  h+='<div class="bar"><label>Área</label>'+sel+
     '<span class="spacer"></span>'+
     '<span class="hstate">Meta declarada: '+META+'% de avance<br>Datos al abrir · '+new Date().toLocaleString('es-PE')+'</span></div>';

  h+='<div class="verdict '+vcls+'"><div class="dot">'+icono+'</div>'+
     '<div><div class="t">'+titulo+'</div><div class="s">'+frase+'</div></div></div>';

  h+='<div class="kpis">'+
    kpi(semKpi(d.avance), d.avance, 1, '%', 'Avance global', 'Suma de los avances ÷ '+d.n+' ideas · meta '+META+'%')+
    kpi('neu', d.n, 0, '', 'Ideas propuestas', 'Todas las del período, cerradas o no')+
    kpi(semKpi(pctCerr), d.cerr, 0, '', 'Cerradas', n1(pctCerr)+'% del total llegó al 100%')+
    kpi('warn', d.proc, 0, '', 'En curso', 'Entre 30% y 70% de avance')+
    kpi(d.venc?'alert':'', d.venc, 0, '', 'Con fecha vencida', 'Abiertas y con la fecha ya pasada')+
    kpi(semKpi(pctFoto), d.conFoto, 0, '', 'Con evidencia', n1(pctFoto)+'% · '+d.fotos+' archivos en total')+
  '</div>';

  h+='<div class="insight">'+ins+'</div>';

  h+='<div class="tabs">'+
     tb(0,'Panorama')+tb(1,'Áreas')+tb(2,'Riesgo')+tb(3,'Evidencia')+tb(4,'Detalle')+'</div>';
  /* los cinco paneles existen siempre en la página: así al imprimir salen todos */
  for(var t=0;t<5;t++)
    h+='<div class="tabpane'+(TAB===t?' active':'')+'" id="pane'+t+'">'+cuerpoTab(t)+'</div>';
  h+=guia();
  $('app').innerHTML=h;

  var vs=document.querySelectorAll('.kpi .v[data-count]');
  for(var i=0;i<vs.length;i++)countUp(vs[i]);

  LISTO={};
  dibujarTab(TAB);
}

function kpi(cls,valor,dec,suf,label,sub){
  return '<div class="kpi '+cls+'"><div class="l">'+label+'</div>'+
    '<div class="row"><span class="v" data-count="'+valor+'" data-dec="'+dec+'" data-suf="'+suf+'">0'+suf+'</span></div>'+
    '<div class="s">'+sub+'</div></div>';
}
function tb(i,txt){return '<button class="'+(TAB===i?'active':'')+'" onclick="setTab('+i+')">'+txt+'</button>';}
function setTab(i){
  TAB=i;
  var bs=document.querySelectorAll('.tabs button');
  for(var k=0;k<bs.length;k++)bs[k].classList.toggle('active',k===i);
  for(var p=0;p<5;p++){
    var el=$('pane'+p);
    if(el)el.classList.toggle('active',p===i);
  }
  dibujarTab(i);
}
function setArea(a){AREA=a;render();}

/* los gráficos se dibujan la primera vez que se ve la pestaña:
   un canvas oculto mide 0 y saldría deformado */
var LISTO={};
function dibujarTab(i){
  if(!LISTO[i]){pintarTab(i);LISTO[i]=true;}
  else for(var k=0;k<CHARTS.length;k++){try{CHARTS[k].resize();}catch(e){}}
}
/* al imprimir se despliegan las cinco */
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('beforeprint',function(){
    for(var t=0;t<5;t++){var el=$('pane'+t);if(el)el.classList.add('active');}
    for(var t2=0;t2<5;t2++)if(!LISTO[t2]){pintarTab(t2);LISTO[t2]=true;}
    for(var k=0;k<CHARTS.length;k++){try{CHARTS[k].resize();}catch(e){}}
  });
  window.addEventListener('afterprint',function(){
    for(var t=0;t<5;t++){var el=$('pane'+t);if(el)el.classList.toggle('active',t===TAB);}
  });
}

function panel(cls,t,sub,cuerpo){
  return '<div class="'+cls+'"><div class="panel"><div class="pt">'+t+'</div><div class="ph">'+sub+'</div>'+cuerpo+'</div></div>';
}
function lienzo(id,extra){return '<div class="cwrap '+(extra||'')+'"><canvas id="'+id+'"></canvas></div>';}

/* ================= pestañas ================= */
/* HTML de cada pestaña, sin gráficos */
function cuerpoTab(T){
  var d=datos(),pa=porArea();
  if(T===0){
    return '<div class="grid">'+
      panel('col8','Cómo está repartida cada área',
        'Cada barra es un área y suma 100%. Verde lo cerrado, ámbar lo que va en camino, gris lo que no arrancó. Mientras más gris, más lejos de la meta.',
        lienzo('cComp','xtall'))+
      panel('col4','Cerradas, en curso y sin empezar',
        'La misma información en proporción, sobre las '+d.n+' ideas mostradas.',
        lienzo('cDona','tall'))+
      panel('col12','En qué escalón están las '+d.n+' ideas',
        'Los cinco escalones que usa el Círculo, del que no ha empezado al que ya está entregado. La meta es que todas lleguen al 100%.',
        lienzo('cEsc'))+
      '</div>';
  }
  if(T===1){
    return '<div class="grid">'+
      panel('col6','Ranking de avance por área',
        'Porcentaje = suma de los avances de las ideas del área ÷ número de ideas de esa área. Nunca es el promedio de los porcentajes de otras áreas. Meta: '+META+'%.',
        '<ul class="rank">'+pa.map(function(x,i){
          return '<li><span class="n">'+(i+1)+'</span>'+
            '<div><div class="nm">'+esc(x.area)+' <span class="sub">· '+x.cerr+' de '+x.n+' cerradas'+
            (x.venc?' · '+x.venc+' vencidas':'')+'</span></div>'+
            '<div class="track"><i class="fill" data-w="'+x.avance.toFixed(1)+'" style="background:'+sem(x.avance)+'"></i></div></div>'+
            '<span class="val" style="color:'+sem(x.avance)+'">'+n1(x.avance)+'%</span></li>';
        }).join('')+'</ul>')+
      panel('col6','Cuántas ideas propone cada área frente a cuánto avanza',
        'Las barras son la cantidad de ideas; la línea es el avance del área. Muchas barras con línea baja significa que el área propone más de lo que alcanza a cerrar.',
        lienzo('cMix','tall'))+
      '</div>';
  }
  if(T===2){
    var v=vencidasList(), conV=pa.filter(function(x){return x.venc>0;});
    return '<div class="grid">'+
      (v.length?panel('col8','Las más atrasadas',
        'Días transcurridos desde la fecha que el área se comprometió a cumplir y no cumplió. Se muestran las 12 con más días.',
        lienzo('cAtraso','xtall'))
       :panel('col8','Sin mejoras vencidas','Ninguna mejora abierta tiene la fecha de cierre pasada.',''))+
      (conV.length?panel('col4','Vencidas por área',
        'Cuántas mejoras vencidas acumula cada área. Es la lista de a quién preguntarle primero.',
        lienzo('cVenc','xtall')):'')+
      panel('col12','Reprogramaciones',
        'Cuántas mejoras tuvieron que mover su fecha de cierre al menos una vez. Reprogramar varias veces suele indicar que la mejora está trabada, no que avanza despacio.',
        '<div class="dual">'+
        '<div class="dcell"><div class="dv">'+d.reprog+'</div><div class="dl">mejoras reprogramadas</div></div>'+
        '<div class="dcell"><div class="dv">'+(d.n?n1(d.reprog/d.n*100):0)+'%</div><div class="dl">del total de ideas</div></div>'+
        '</div>'+(d.reprog===0?'<div class="note">Todavía no hay reprogramaciones registradas. Este número empieza a contar desde ahora: las del archivo antiguo no quedaron guardadas.</div>':''))+
      '</div>';
  }
  if(T===3){
    return '<div class="grid">'+
      panel('col8','Qué tanto se documenta cada área',
        'Porcentaje de ideas del área con al menos un archivo cargado. Sin evidencia, que una mejora esté cerrada es solo una declaración.',
        lienzo('cFoto','xtall'))+
      panel('col4','Antes contra después',
        'Una evidencia sirve cuando se puede comparar. Si solo hay foto del resultado, no hay con qué contrastarla.',
        lienzo('cAD','tall')+
        (d.nDesp>d.nAntes*1.3?'<div class="note">Hay '+n1(d.nDesp/Math.max(d.nAntes,1))+' veces más archivos del después que del antes. Las áreas documentan el logro, casi nunca la situación previa.</div>':''))+
      '</div>';
  }
  var l=d.f.slice().sort(function(a,b){
    return a.area===b.area?a.id.localeCompare(b.id):a.area.localeCompare(b.area);});
  return '<div class="grid">'+panel('col12','Detalle de las '+l.length+' ideas',
    'La lista completa, por si hace falta buscar una mejora puntual.',
    '<input class="busca" type="search" placeholder="Buscar por código, área, idea o responsable…" oninput="filtraTabla(this.value)">'+
    '<div id="tw">'+tabla(l)+'</div>')+'</div>';
}

/* gráficos de cada pestaña */
function pintarTab(T){
  var d=datos(),pa=porArea();

  if(T===0){
    var lab=pa.map(function(x){return corto(x.area,20);});
    mk('cComp',{type:'bar',
      data:{labels:lab,datasets:[
        {label:'Cerradas',data:pa.map(function(x){return x.cerr/x.n*100;}),backgroundColor:C_CERR,borderRadius:4},
        {label:'En curso',data:pa.map(function(x){return x.curso/x.n*100;}),backgroundColor:C_CURSO,borderRadius:4},
        {label:'Sin empezar',data:pa.map(function(x){return x.nada/x.n*100;}),backgroundColor:C_NADA,borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,
        plugins:{tooltip:{callbacks:{label:function(x){
          var a=pa[x.dataIndex];
          var cant=x.datasetIndex===0?a.cerr:x.datasetIndex===1?a.curso:a.nada;
          return x.dataset.label+': '+cant+' de '+a.n+' ('+n1(x.raw)+'%)';}}}},
        scales:{x:{stacked:true,max:100,grid:{color:'#F1F6F4'},ticks:{callback:function(v){return v+'%';}}},
                y:{stacked:true,grid:{display:false}}}}});

    mk('cDona',{type:'doughnut',
      data:{labels:['Cerradas','En curso','Sin empezar'],
        datasets:[{data:[d.cerr,d.proc,d.nini],backgroundColor:[C_CERR,C_CURSO,C_NADA],borderWidth:0}]},
      options:{responsive:true,cutout:'74%',
        plugins:{tooltip:{callbacks:{
          label:function(x){return x.label+': '+x.raw+' ideas ('+n1(d.n?x.raw/d.n*100:0)+'%)';}}}}}});

    var cnt=ESCALA.map(function(e){return d.f.filter(function(m){return Math.abs(m.pct-e.p)<0.001;}).length;});

        plugins:{legend:{display:false},tooltip:{callbacks:{

                x:{grid:{display:false}}}}});
  }

  if(T===1){
    setTimeout(function(){
      var f=document.querySelectorAll('.rank .fill');
      for(var i=0;i<f.length;i++)f[i].style.width=f[i].dataset.w+'%';
    },120);

    mk('cMix',{data:{labels:pa.map(function(x){return corto(x.area,14);}),
      datasets:[
        {type:'bar',label:'Ideas propuestas',data:pa.map(function(x){return x.n;}),
         backgroundColor:'#DCE5E2',borderRadius:4,order:2,yAxisID:'y'},
        {type:'bar',label:'Ideas cerradas',data:pa.map(function(x){return x.cerr;}),
         backgroundColor:C_CERR,borderRadius:4,order:1,yAxisID:'y'},
        {type:'line',label:'Avance del área',data:pa.map(function(x){return x.avance;}),
         borderColor:C_AZUL,backgroundColor:C_AZUL,borderWidth:2.5,pointRadius:4,
         pointBorderColor:'#fff',tension:.3,order:0,yAxisID:'y1'},
        {type:'line',label:'Meta '+META+'%',data:pa.map(function(){return META;}),
         borderColor:'#F59E0B',borderDash:[6,5],borderWidth:2,pointRadius:0,order:0,yAxisID:'y1'}]},
      options:{responsive:true,
        plugins:{tooltip:{callbacks:{label:function(x){
          return x.dataset.type==='line'? x.dataset.label+': '+n1(x.raw)+'%' : x.dataset.label+': '+x.raw;}}}},
        scales:{y:{beginAtZero:true,position:'left',grid:{color:'#F1F6F4'},title:{display:true,text:'Ideas'}},
                y1:{beginAtZero:true,max:100,position:'right',grid:{display:false},
                    ticks:{callback:function(v){return v+'%';}},title:{display:true,text:'Avance'}},
                x:{grid:{display:false},ticks:{maxRotation:60,minRotation:45}}}}});
  }

  if(T===2){
    var v=vencidasList(),top=v.slice(0,12);
    var conV=pa.filter(function(x){return x.venc>0;});
    if(v.length) mk('cAtraso',{type:'bar',
      data:{labels:top.map(function(m){return m.id+' · '+corto(m.idea,32);}),
        datasets:[{data:top.map(function(m){return m._d;}),
          backgroundColor:top.map(function(m){return sem(m.pct*100);}),borderRadius:4,barThickness:16}]},
      options:{indexAxis:'y',responsive:true,layout:{padding:{right:44}},
        plugins:{legend:{display:false},etiquetaBarra:{on:true,dec:0,suf:' d'},
          tooltip:{callbacks:{
          label:function(x){return x.raw+' días vencida · avance '+Math.round(top[x.dataIndex].pct*100)+'%';}}}},
        scales:{x:{beginAtZero:true,grid:{color:'#F1F6F4'},title:{display:true,text:'Días de atraso'}},
                y:{grid:{display:false},ticks:{font:{size:10.5}}}}}});

      options:{indexAxis:'y',responsive:true,layout:{padding:{right:36}},
        plugins:{legend:{display:false},etiquetaBarra:{on:true,dec:0},

        scales:{x:{beginAtZero:true,grid:{color:'#F1F6F4'},ticks:{precision:0}},y:{grid:{display:false}}}}});
  }

  if(T===3){
    mk('cFoto',{type:'bar',
      data:{labels:pa.map(function(x){return corto(x.area,20);}),
        datasets:[{data:pa.map(function(x){return x.pctFoto;}),
          backgroundColor:pa.map(function(x){return sem(x.pctFoto);}),borderRadius:4,barThickness:16}]},
      options:{indexAxis:'y',responsive:true,layout:{padding:{right:46}},
        plugins:{legend:{display:false},etiquetaBarra:{on:true,dec:1,suf:'%'},

          label:function(x){return pa[x.dataIndex].foto+' de '+pa[x.dataIndex].n+' ideas con evidencia ('+n1(x.raw)+'%)';}}}},
        scales:{x:{beginAtZero:true,max:100,grid:{color:'#F1F6F4'},ticks:{callback:function(v){return v+'%';}}},
                y:{grid:{display:false}}}}});

    mk('cAD',{type:'bar',
      data:{labels:['Del antes','Del después'],
        datasets:[{data:[d.nAntes,d.nDesp],backgroundColor:[C_AZUL,C_CERR],borderRadius:4,barThickness:56}]},
      options:{responsive:true,
        plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,grid:{color:'#F1F6F4'},title:{display:true,text:'Archivos'}},
                x:{grid:{display:false}}}}});
  }

}

function filtraTabla(q){
  q=(q||'').toLowerCase();
  var fs=document.querySelectorAll('#tw tbody tr');
  for(var i=0;i<fs.length;i++){
    fs[i].style.display = fs[i].textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none';
  }
}

function tabla(l){
  var ids={};E.forEach(function(x){ids[x.idMejora]=(ids[x.idMejora]||0)+1;});
  var hoy=hoyISO();
  return '<div style="overflow-x:auto"><table><thead><tr>'+
    '<th>Código</th><th>Área</th><th>Idea de mejora</th><th>Avance</th><th>Fecha de cierre</th><th>Archivos</th>'+
    '</tr></thead><tbody>'+l.map(function(m){
      var fc=(m.fechaCierre||'').substring(0,10);
      var v=fc&&fc<hoy&&m.pct<1;
      var rp=(m.vecesReprog||0);
      return '<tr><td><b>'+esc(m.id)+'</b></td><td>'+esc(m.area)+'</td><td>'+esc(m.idea)+'</td>'+
      '<td><span class="pill '+semClase(m.pct*100)+'">'+Math.round(m.pct*100)+'%</span>'+
      (m.revisar==='SI'?' <span class="pill neu">revisar</span>':'')+'</td>'+
      '<td>'+(fc?esc(fc):'<span class="gris">—</span>')+(v?' <span class="pill bad">vencida</span>':'')+
      (rp?'<div style="font-size:10.5px;color:#8A6100">reprogramada '+rp+'×</div>':'')+'</td>'+
      '<td>'+(ids[m.id]||0)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function guia(){
  return '<details class="help"><summary>¿Cómo leo este tablero?</summary><dl>'+
  '<dt>Círculo de Mejoras</dt><dd>Reunión semanal en la que cada una de las 16 áreas propone ideas para mejorar su propio trabajo, y se les hace seguimiento hasta cerrarlas.</dd>'+
  '<dt>Avance global</dt><dd>Se suma el avance de cada idea (0 · 0.3 · 0.5 · 0.7 · 1) y se divide entre la cantidad de ideas. Una idea al 50% aporta la mitad que una cerrada. No se promedian los porcentajes de las áreas entre sí.</dd>'+
  '<dt>Meta y semáforo</dt><dd>La meta es <b>'+META+'%</b>: que toda mejora propuesta termine cerrada. Verde en meta ('+META+'%), ámbar entre '+(META*0.8)+'% y '+META+'%, rojo por debajo de '+(META*0.8)+'%. Aquí subir es bueno, al revés que en indicadores de rechazo.</dd>'+
  '<dt>Los cinco escalones</dt><dd>0% no iniciado · 30% solicitud realizada · 50% pedido en gestión · 70% confirmado por el proveedor · 100% entregado o implementado. Es la misma escala que ya se usaba en los archivos de cumplimiento de cada área.</dd>'+
  '<dt>Fecha vencida</dt><dd>En la reunión el área dice para cuándo estará lista la mejora. Si esa fecha ya pasó y la mejora sigue abierta, cuenta como vencida.</dd>'+
  '<dt>Reprogramada</dt><dd>Cuántas veces se movió la fecha comprometida. Reprogramar varias veces suele indicar que la mejora está trabada, no que avanza despacio.</dd>'+
  '<dt>Con evidencia</dt><dd>Ideas con al menos una foto o archivo cargado. Es la única forma de verificar que la mejora se ejecutó y no solo se declaró cerrada.</dd>'+
  '<dt>Exclusiones</dt><dd>Ninguna. Entran las 630 ideas migradas del archivo Excel más las que se registren desde el panel. Las que llegaron sin estado se cargaron en 0%, así que el avance real podría ser algo mayor que el mostrado.</dd>'+
  '<dt>¿De dónde salen los datos?</dt><dd>De la base de datos de LIVES (Supabase), que se actualiza desde el panel de gestión. Esta página la vuelve a leer cada vez que se abre o se refresca.</dd>'+
  '</dl></details>';
}
window.setTab=setTab;window.setArea=setArea;window.filtraTabla=filtraTabla;window.cargarDatos=cargarDatos;

cargarDatos();
</script>

var FMT={texto:'@',alfanumerico:'@',entero:'#,##0',decimal:'#,##0.00',porcentaje:'0.00%',fecha:'dd/mm/yyyy',fecha_hora:'dd/mm/yyyy hh:mm',horas:'#,##0.0" h"',moneda:'"S/ "#,##0.00'};
function cargarExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise(function(ok,mal){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=function(){ok();}; s.onerror=function(){mal(new Error('No se pudo cargar el generador de Excel (sin conexión).'));};
    document.head.appendChild(s);
  });
}
function vacio(v){return v===null||v===undefined||v==='';}
function largo(v,tipo){if(vacio(v))return 0;if(v instanceof Date)return 11;if(typeof v==='number')return (tipo==='porcentaje'?7:String(Math.round(v)).length+4);return String(v).length;}
function banda(h,fila,n,texto,tipo){
  h.mergeCells(fila,1,fila,n);var c=h.getCell(fila,1);c.value=texto;
  if(tipo==='titulo'){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LX.PETROLEO}};c.font={name:'Calibri',size:13,bold:true,color:{argb:'FFFFFFFF'}};c.alignment={vertical:'middle',horizontal:'left',indent:18};h.getRow(fila).height=34;}
  else if(tipo==='sub'){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LX.SLATE}};c.font={name:'Calibri',size:10,bold:true,color:{argb:'FFFFFFFF'}};c.alignment={vertical:'middle',horizontal:'left',indent:18};h.getRow(fila).height=18;}
  else {c.font={name:'Calibri',size:9,italic:true,color:{argb:LX.GRIS}};c.alignment={vertical:'middle',horizontal:'left',indent:1,wrapText:true};h.getRow(fila).height=tipo==='formula'?30:16;}
}
function cabecera(wb,h,n,ctx){
  var f=1;banda(h,f++,n,ctx.titulo,'titulo');
  if(LX.LOGO_B64){var img=wb.addImage({base64:LX.LOGO_B64,extension:'png'});h.addImage(img,{tl:{col:0.12,row:0.22},ext:{width:120,height:31}});}
  if(ctx.sub) banda(h,f++,n,ctx.sub,'sub');
  if(ctx.formula) banda(h,f++,n,ctx.formula,'formula');
  return f;
}
function encabezados(h,fila,cols){
  cols.forEach(function(c,j){var cel=h.getCell(fila,j+1);cel.value=c.titulo;
    cel.fill={type:'pattern',pattern:'solid',fgColor:{argb:LX.SALVIA_OSC}};cel.font={name:'Calibri',size:11,bold:true,color:{argb:'FFFFFFFF'}};
    cel.alignment={vertical:'middle',horizontal:'center',wrapText:true};cel.border={bottom:{style:'thin',color:{argb:LX.BORDE}}};});
  h.getRow(fila).height=22;
}
function datos(h,fila,cols,filas){
  filas.forEach(function(f,i){cols.forEach(function(c,j){var cel=h.getCell(fila+i,j+1),v=f[c.campo];
    cel.value=vacio(v)?null:v;cel.numFmt=FMT[c.tipo]||'@';cel.font={name:'Calibri',size:11,color:{argb:LX.TXT},bold:!!f.__total};
    cel.alignment={vertical:'middle',horizontal:(c.tipo==='texto'||c.tipo==='alfanumerico')?'left':'right'};
    if(i%2===1)cel.fill={type:'pattern',pattern:'solid',fgColor:{argb:LX.WARM}};
    cel.border=f.__total?{top:{style:'thin',color:{argb:LX.SALVIA_OSC}}}:{bottom:{style:'hair',color:{argb:LX.BORDE}}};});});
}
function anchos(h,n,grupos){
  for(var j=0;j<n;j++){var max=9;grupos.forEach(function(g){var c=g.cols[j];if(!c)return;
      var m=String(c.titulo).length;g.filas.forEach(function(f){var L=largo(f[c.campo],c.tipo);if(L>m)m=L;});if(m+3>max)max=m+3;});
    h.getColumn(j+1).width=Math.min(Math.max(max,9),42);}
}
function pie(h,fila,n,texto){h.mergeCells(fila,1,fila,n);var c=h.getCell(fila,1);c.value=texto;c.font={name:'Calibri',size:9,italic:true,color:{argb:LX.GRIS}};}
/* Libro: hoja Resumen (secciones como en pantalla) + hoja Detalle (cada registro). */
function libro(cfg){
  return cargarExcelJS().then(function(){
    var wb=new ExcelJS.Workbook();wb.creator='LIVES';wb.created=new Date();
    var hoy=new Date().toLocaleString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    /* Resumen */
    var secs=(cfg.resumen||[]).filter(function(s){return s.filas&&s.filas.length;});
    if(secs.length){
      var n=Math.max.apply(null,secs.map(function(s){return s.columnas.length;}));
      var h=wb.addWorksheet('Resumen',{pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0}});
      var f=cabecera(wb,h,n,cfg)+1;
      secs.forEach(function(s){
        var ct=h.getCell(f,1);ct.value=s.titulo;ct.font={name:'Calibri',size:12,bold:true,color:{argb:LX.PETROLEO}};h.getRow(f).height=20;f++;
        if(s.nota){banda(h,f++,n,s.nota,'nota');}
        encabezados(h,f,s.columnas);f++;datos(h,f,s.columnas,s.filas);f+=s.filas.length+1;
      });
      pie(h,f,n,'Generado el '+hoy+' desde '+(cfg.origen||cfg.titulo));
      anchos(h,n,secs.map(function(s){return {cols:s.columnas,filas:s.filas};}));
      if(h.getColumn(1).width<24)h.getColumn(1).width=24;
    }
    /* Detalle */
    var d=cfg.detalle;
    if(d&&d.columnas&&d.columnas.length){
      var nd=d.columnas.length;
      var hd=wb.addWorksheet('Detalle',{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
      var fe=cabecera(wb,hd,nd,{titulo:cfg.titulo+' — Detalle',sub:cfg.sub,formula:d.nota||''});
      encabezados(hd,fe,d.columnas);datos(hd,fe+1,d.columnas,d.filas);
      hd.views=[{state:'frozen',xSplit:d.congelarCols||0,ySplit:fe}];
      hd.autoFilter={from:{row:fe,column:1},to:{row:fe+Math.max(d.filas.length,1),column:nd}};
      pie(hd,fe+d.filas.length+2,nd,'Generado el '+hoy+' desde '+(cfg.origen||cfg.titulo)+' · '+d.filas.length+' fila(s)');
      anchos(hd,nd,[{cols:d.columnas,filas:d.filas}]);
    }
    return wb.xlsx.writeBuffer().then(function(buf){
      var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=(cfg.titulo+(cfg.sub?'_'+cfg.sub:'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,90)+'.xlsx';
      document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    });
  });
}
function txt(sel){var e=typeof sel==='string'?document.querySelector(sel):sel;return e?(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim():'';}
function titulo(){return (document.title||'').replace(/\s*·\s*LIVES\s*$/,'').trim();}
function boton(ref,antes,clase,click){
  if(!ref||document.getElementById('lsXlsBtn'))return;
  var b=document.createElement('button');b.type='button';b.id='lsXlsBtn';b.className=clase;b.textContent='Descargar Excel';
  b.title='Descarga en Excel lo que estás viendo (resumen) y cada registro (detalle).';
  b.addEventListener('click',function(){
    var t=b.textContent;b.disabled=true;b.textContent='Preparando…';
    Promise.resolve().then(click).then(function(){b.textContent=t;b.disabled=false;},function(e){
      b.textContent=t;b.disabled=false;
      var m=document.getElementById('lsXlsErr');if(!m){m=document.createElement('div');m.id='lsXlsErr';m.style.cssText='color:#B42318;font-size:12px;margin:4px 0';b.parentNode.insertBefore(m,b.nextSibling);}
      m.textContent='No se pudo generar el Excel: '+(e&&e.message||e);setTimeout(function(){if(m)m.remove();},8000);});
  });
  if(antes)ref.parentNode.insertBefore(b,ref);else ref.parentNode.insertBefore(b,ref.nextSibling);
}

          {campo:'b',titulo:'Básico',tipo:'moneda'},{campo:'pi',titulo:'% de incentivo',tipo:'porcentaje'},{campo:'ir',titulo:'Incentivo Real',tipo:'moneda'},{campo:'is',titulo:'Incentivo Sistema',tipo:'moneda'},{campo:'d',titulo:'Diferencia Real − Sistema',tipo:'moneda'}]}});
    };
    if(typeof api!=='function')return armar([]);
    return api('eficiencias',{desde:iso(lun),hasta:iso(dom)}).then(armar,function(){return armar([]);});
  }
};

/* Botón que se vuelve a poner si el tablero redibuja su barra (ej. Círculo de Mejoras). */
var VIGIA=null;
function vigilar(){if(VIGIA||!window.MutationObserver)return;var pend=false;
  VIGIA=new MutationObserver(function(){if(pend||document.getElementById('lsXlsBtn'))return;pend=true;setTimeout(function(){pend=false;iniciar();},60);});
  VIGIA.observe(document.body,{childList:true,subtree:true});}

var ADAPT=[CAL,IFC,CHK,MEJ,POT,COR];
function iniciar(){var hay=false;ADAPT.forEach(function(a){try{if(a.detecta()){hay=true;a.pone();}}catch(e){}});if(hay)vigilar();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
window.addEventListener('load',iniciar);
}catch(e){}})();
</script>
