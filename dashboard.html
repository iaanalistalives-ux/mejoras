<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero Círculo de Mejoras · LIVES</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --petrol:#0E3B36; --petrol-2:#12463F; --emer:#10B981;
  --sage:#0F7A5A; --sage-dark:#0B815E; --slate:#4E6B78;
  --taupe:#B45309; --rose:#DC2626; --tan:#F59E0B;
  --warm:#DCE5E2; --warm-light:#F1F6F4; --stone:#5F726C;
  --card:#fff;
  --sh:0 1px 3px rgba(14,59,54,.06),0 1px 2px rgba(14,59,54,.04);
  --sh-h:0 4px 12px rgba(14,59,54,.10);
  --r:12px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--warm-light);color:#333;
font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.45;
font-variant-numeric:tabular-nums;}

.wrap{width:100%;max-width:1440px;margin:0 auto;padding:18px 22px 44px;}

/* ---- barra de filtros ---- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);
border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;margin-bottom:14px;
position:sticky;top:0;z-index:15;}
.bar label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--stone);}
select{font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sage);
border:1px solid var(--warm);border-radius:8px;padding:7px 12px;background:#fff;cursor:pointer;}
select:hover{border-color:var(--sage);}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:8px 14px;
cursor:pointer;border:1px solid var(--warm);background:#fff;color:var(--sage);}
.btn:hover{border-color:var(--sage);}
.spacer{margin-left:auto;}
.hstate{font-size:11.5px;color:var(--stone);text-align:right;}

/* ---- banda de veredicto ---- */
.verdict{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--r);
box-shadow:var(--sh);padding:16px 20px;margin-bottom:14px;border-left:6px solid var(--rose);}
.verdict .dot{width:44px;height:44px;border-radius:50%;background:#FCEBEB;color:var(--rose);
display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none;}
.verdict .t{font-size:19px;font-weight:700;color:var(--rose);line-height:1.2;}
.verdict .s{font-size:13px;color:#333;margin-top:3px;}
.verdict.ok{border-left-color:var(--sage);}
.verdict.ok .dot{background:#E7F4EF;color:var(--sage);} .verdict.ok .t{color:var(--sage);}
.verdict.warn{border-left-color:var(--tan);}
.verdict.warn .dot{background:#FEF3E2;color:var(--taupe);} .verdict.warn .t{color:var(--taupe);}

/* ---- KPIs ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;
position:relative;overflow:hidden;transition:box-shadow .15s,transform .15s;}
.kpi:hover{box-shadow:var(--sh-h);transform:translateY(-1px);}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sage);}
.kpi.alert::after{background:var(--rose);}
.kpi.warn::after{background:var(--tan);}
.kpi.neu::after{background:var(--slate);}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--stone);}
.kpi .row{display:flex;align-items:baseline;gap:8px;margin-top:5px;}
.kpi .v{font-size:32px;font-weight:700;line-height:1;color:var(--sage);}
.kpi.alert .v{color:var(--rose);}
.kpi.warn .v{color:var(--taupe);}
.kpi.neu .v{color:var(--slate);}
.kpi .s{font-size:11.5px;color:var(--stone);margin-top:3px;}

/* ---- insight ---- */
.insight{background:var(--card);border-left:4px solid var(--tan);border-radius:0 var(--r) var(--r) 0;
box-shadow:var(--sh);padding:12px 16px;margin-bottom:16px;font-size:13.5px;}
.insight b{color:var(--sage-dark);}

/* ---- pestañas ---- */
.tabpane{display:none;} .tabpane.active{display:block;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--warm);margin:22px 0 14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:700;
color:var(--stone);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
.tabs button:hover{color:var(--sage);}
.tabs button.active{color:var(--sage-dark);border-bottom-color:var(--sage);}

/* ---- grilla y paneles ---- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
.col12{grid-column:span 12;} .col8{grid-column:span 8;}
.col6{grid-column:span 6;} .col4{grid-column:span 4;}
@media(max-width:1100px){.col8,.col6,.col4{grid-column:span 12;}}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;}
.panel .pt{font-size:15px;font-weight:700;}
.panel .ph{font-size:11.5px;color:var(--stone);margin-top:2px;margin-bottom:12px;}

/* ---- gráficos ---- */
.cwrap{position:relative;width:100%;height:clamp(220px,26vh,320px);}
.cwrap.tall{height:clamp(260px,34vh,400px);}
.cwrap.xtall{height:clamp(380px,52vh,560px);}
.cwrap canvas{position:absolute;inset:0;}

/* ---- ranking ---- */
.rank{list-style:none;margin:0;padding:0;}
.rank li{display:grid;grid-template-columns:24px 1fr 62px;align-items:center;gap:10px;
padding:9px 0;border-bottom:1px solid var(--warm-light);}
.rank li:last-child{border-bottom:none;}
.rank .n{width:24px;height:24px;border-radius:50%;background:var(--warm-light);color:var(--stone);
font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.rank .nm{font-size:13px;font-weight:700;}
.rank .sub{font-size:10.5px;color:var(--stone);font-weight:400;}
.rank .track{height:7px;background:var(--warm-light);border-radius:4px;margin-top:5px;overflow:hidden;}
.rank .fill{height:100%;border-radius:4px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);}
.rank .val{text-align:right;font-size:15px;font-weight:700;}

/* ---- tabla ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
color:var(--stone);border-bottom:1px solid var(--warm);padding:8px 6px;}
td{padding:8px 6px;border-bottom:1px solid var(--warm-light);vertical-align:top;}
tr:hover td{background:var(--warm-light);}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.pill.ok{background:#E7F4EF;color:var(--sage);}
.pill.warn{background:#FEF3E2;color:var(--taupe);}
.pill.bad{background:#FCEBEB;color:var(--rose);}
.pill.neu{background:var(--warm-light);color:var(--stone);}
.busca{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--warm);
border-radius:8px;padding:9px 12px;margin-bottom:12px;}
.gris{color:#9aa8a4;}

/* ---- dual ---- */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dcell{background:var(--warm-light);border-radius:10px;padding:16px;text-align:center;}
.dcell .dv{font-size:30px;font-weight:700;color:var(--sage);line-height:1.1;}
.dcell .dl{font-size:12px;color:var(--stone);margin-top:3px;}
.note{margin-top:12px;background:var(--card);border-left:4px solid var(--tan);
border-radius:0 8px 8px 0;padding:10px 13px;font-size:12px;color:#333;line-height:1.5;}

/* ---- ayuda ---- */
details.help{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
padding:12px 16px;margin-top:18px;font-size:13px;}
details.help summary{cursor:pointer;font-weight:700;color:var(--sage-dark);}
details.help dt{font-weight:700;font-size:12.5px;color:#333;margin-top:11px;}
details.help dd{margin:2px 0 0;font-size:12.5px;color:var(--stone);line-height:1.5;}

.load{text-align:center;padding:60px 20px;color:var(--stone);}
.err{background:#FBE9E9;border:1px solid var(--rose);border-radius:8px;
padding:14px 18px;color:var(--rose);font-size:13px;}

/* ===== TABLET (hasta 900px) ===== */
@media(max-width:900px){
  .wrap{padding:14px 14px 36px;}
  .col12,.col8,.col6,.col4{grid-column:span 12;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .cwrap{height:300px;}
  .cwrap.tall{height:340px;}
  .cwrap.xtall{height:420px;}
}

/* ===== CELULAR (hasta 600px) ===== */
@media(max-width:600px){
  body{font-size:13.5px;}
  .bar{position:static;flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;gap:8px;-webkit-overflow-scrolling:touch;}
  .bar::-webkit-scrollbar{display:none;}
  .bar>*{flex:none;}
  .btn,select{min-height:44px;font-size:14px;}
  .spacer{display:none;}
  .hstate{text-align:left;}

  .verdict{padding:14px;gap:12px;}
  .verdict .dot{width:36px;height:36px;font-size:18px;}
  .verdict .t{font-size:16px;}

  .kpis{grid-template-columns:1fr;gap:10px;}
  .kpi .v{font-size:26px;}
  .kpi:hover{transform:none;box-shadow:var(--sh);}

  .cwrap,.cwrap.tall{height:260px;}
  .cwrap.xtall{height:420px;}

  .tabs{flex-wrap:nowrap;overflow-x:auto;gap:0;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{flex:none;padding:12px 14px;font-size:13px;}

  .panel{padding:14px;overflow-x:auto;}
  table{min-width:520px;}

  .rank li{grid-template-columns:22px 1fr 56px;}
  .rank .val{font-size:14px;}

  .dual{grid-template-columns:1fr;}
  .panel:hover{box-shadow:var(--sh);}
  .kpi:active{background:var(--warm-light);}
}

/* ===== IMPRESIÓN A4 ===== */
@media print{
  @page{size:A4 landscape;margin:9mm;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .bar,.tabs,.no-print,details.help{display:none!important;}
  body{background:#fff!important;}
  .wrap{max-width:none;padding:0;}
  .tabpane{display:block!important;}
  .panel,.kpi,.insight,.verdict{box-shadow:none;border:1px solid var(--warm);break-inside:avoid;}
  .cwrap,.cwrap.tall,.cwrap.xtall{height:170px!important;}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">Cargando datos del Círculo de Mejoras…</div></div>
<script>
var API="https://script.google.com/macros/s/AKfycbyBNClTs9yhFChBNPdA4-VNi5jdjhUD2Gv_1reqjuahZE6gpyCFnNm1FyBEBVV9EIjL/exec";
var META=100;   /* meta declarada: 100 % de avance */

var ESCALA=[{p:0,c:'No iniciado'},{p:0.3,c:'Solicitud realizada'},{p:0.5,c:'Pedido en gestión'},
            {p:0.7,c:'Confirmado por proveedor'},{p:1,c:'Entregado / cerrado'}];
var COL_ESC=['#C9D6D2','#F59E0B','#B45309','#4E6B78','#0F7A5A'];
var C_CERR='#0F7A5A', C_CURSO='#F59E0B', C_NADA='#C9D6D2', C_MAL='#DC2626', C_AZUL='#4E6B78';
var M=[],E=[],TAB=0,AREA='',CHARTS=[];

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function estadoDe(p){for(var i=0;i<ESCALA.length;i++)if(Math.abs(ESCALA[i].p-p)<0.001)return ESCALA[i].c;return '—';}
function n1(x){return (Math.round(x*10)/10).toLocaleString('es-PE');}
function hoyISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dias(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function corto(s,n){s=String(s||'');return s.length>n?s.substring(0,n-1)+'…':s;}

/* semáforo único: la meta es llegar al 100 %, así que aquí SUBIR ES BUENO.
   En meta → verde. Hasta 20 puntos por debajo → ámbar. Más abajo → rojo. */
function sem(p){return p>=META?'#0F7A5A':(p>=META*0.8?'#F59E0B':'#DC2626');}
function semClase(p){return p>=META?'ok':(p>=META*0.8?'warn':'bad');}
function semKpi(p){return p>=META?'':(p>=META*0.8?'warn':'alert');}

function jsonp(params,cb,err){
  var fn='d_'+Math.random().toString(36).slice(2);
  var t=setTimeout(function(){lim();err&&err('Tiempo agotado (90 s)');},90000);
  window[fn]=function(r){clearTimeout(t);lim();cb(r);};
  function lim(){try{delete window[fn];}catch(e){}if(s&&s.parentNode)s.parentNode.removeChild(s);}
  var q=[];for(var k in params)q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  q.push('callback='+fn);
  var s=document.createElement('script');s.src=API+'?'+q.join('&');
  s.onerror=function(){clearTimeout(t);lim();err&&err('Sin conexión');};
  document.body.appendChild(s);
}

if(typeof Chart!=='undefined'){
  Chart.defaults.font.family='Calibri, Arial, sans-serif';
  Chart.defaults.font.size=12;
  Chart.defaults.color='#5F726C';
  Chart.defaults.borderColor='#F1F6F4';
  Chart.defaults.maintainAspectRatio=false;
  Chart.defaults.plugins.tooltip.backgroundColor='rgba(14,59,54,.95)';
  Chart.defaults.plugins.tooltip.padding=10;
  Chart.defaults.plugins.tooltip.cornerRadius=6;
  Chart.defaults.plugins.legend.position='bottom';
  Chart.defaults.plugins.legend.labels.usePointStyle=true;
  Chart.defaults.plugins.legend.labels.boxWidth=12;
  Chart.defaults.plugins.legend.labels.padding=14;
  if(window.matchMedia('(max-width:600px)').matches){
    Chart.defaults.font.size=11;
    Chart.defaults.plugins.legend.labels.boxWidth=10;
  }
}
/* la skill pide el valor al final de la barra, fuera de ella */
var etiquetaBarra={
  id:'etiquetaBarra',
  afterDatasetsDraw:function(ch,args,opts){
    if(!opts||!opts.on)return;
    var g=ch.ctx, suf=opts.suf||'';
    g.save();
    g.font='700 11px Calibri, Arial, sans-serif';
    g.fillStyle='#333';
    g.textBaseline='middle';
    ch.data.datasets.forEach(function(ds,di){
      var meta=ch.getDatasetMeta(di);
      if(meta.hidden)return;
      meta.data.forEach(function(barra,i){
        var v=ds.data[i];
        if(v===null||v===undefined)return;
        var txt=(opts.dec===0?Math.round(v):Math.round(v*10)/10).toLocaleString('es-PE')+suf;
        g.fillText(txt,barra.x+7,barra.y);
      });
    });
    g.restore();
  }
};
if(typeof Chart!=='undefined')Chart.register(etiquetaBarra);

function limpiarCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
function mk(id,cfg){var el=$(id);if(!el||typeof Chart==='undefined')return;CHARTS.push(new Chart(el,cfg));}

/* contador animado del KPI */
function countUp(el){
  var end=+el.dataset.count, dec=+el.dataset.dec||0, suf=el.dataset.suf||'';
  var t0=performance.now();
  (function step(t){
    var k=Math.min((t-t0)/900,1), e=1-Math.pow(1-k,3);
    el.textContent=(end*e).toLocaleString('es-PE',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
    if(k<1)requestAnimationFrame(step);
  })(t0);
}

var REI=0;
function cargarDatos(){
  $('app').innerHTML='<div class="load">Cargando datos del Círculo de Mejoras…</div>';
  jsonp({accion:'mejoras'},function(r){
    if(!r.ok){$('app').innerHTML='<div class="err">Error al leer los datos: '+esc(r.error)+'</div>';return;}
    REI=0;M=r.mejoras||[];render();
    jsonp({accion:'evidencias'},function(r2){if(r2&&r2.ok){E=r2.evidencias||[];render();}},function(){});
  },function(e){
    if(REI<1){REI++;$('app').innerHTML='<div class="load">La conexión falló. Reintentando…</div>';
      setTimeout(cargarDatos,2500);return;}
    var enApp=/FBAN|FBAV|Instagram|Line|WhatsApp|Micromessenger/i.test(navigator.userAgent);
    $('app').innerHTML='<div class="err"><b>No se pudo conectar con el Sheet.</b> '+esc(e)+
      '<div style="margin-top:10px;font-weight:400;line-height:1.6">'+
      (enApp?'Parece que abriste el enlace dentro de otra aplicación. Toca los tres puntos y elige «Abrir en Chrome».<br>':'')+
      'Revisa la señal y que la implementación tenga acceso para «Cualquier usuario».</div>'+
      '<div style="margin-top:12px"><button class="btn" onclick="REI=0;cargarDatos()">Reintentar</button></div></div>';
  });
}

/* ================= cálculos (idénticos a la versión anterior) ================= */
function datos(){
  var f=AREA?M.filter(function(m){return m.area===AREA;}):M;
  var n=f.length,suma=0,cerr=0,proc=0,nini=0;
  f.forEach(function(m){suma+=m.pct;if(m.pct>=1)cerr++;else if(m.pct>0)proc++;else nini++;});
  var ids={};E.forEach(function(x){ids[x.idMejora]=1;});
  var conFoto=f.filter(function(m){return ids[m.id];}).length;
  var rev=f.filter(function(m){return m.revisar==='SI';}).length;
  var reprog=f.filter(function(m){return (m.vecesReprog||0)>0;}).length;
  var hoy=hoyISO();
  var venc=f.filter(function(m){var fc=(m.fechaCierre||'').substring(0,10);
    return fc&&fc<hoy&&m.pct<1;}).length;
  var nAntes=0,nDesp=0;
  E.forEach(function(x){if(x.tipo==='DESPUES')nDesp++;else nAntes++;});
  return {f:f,n:n,suma:suma,avance:n?suma/n*100:0,cerr:cerr,proc:proc,nini:nini,
          conFoto:conFoto,rev:rev,fotos:E.length,reprog:reprog,venc:venc,
          nAntes:nAntes,nDesp:nDesp};
}

function porArea(){
  var g={},hoy=hoyISO();
  var ids={};E.forEach(function(x){ids[x.idMejora]=1;});
  M.forEach(function(m){
    if(!g[m.area])g[m.area]={n:0,s:0,c:0,p:0,z:0,v:0,f:0,r:0};
    var a=g[m.area];a.n++;a.s+=m.pct;
    if(m.pct>=1)a.c++;else if(m.pct>0)a.p++;else a.z++;
    var fc=(m.fechaCierre||'').substring(0,10);
    if(fc&&fc<hoy&&m.pct<1)a.v++;
    if(ids[m.id])a.f++;
    if((m.vecesReprog||0)>0)a.r++;
  });
  return Object.keys(g).map(function(a){var x=g[a];
    return {area:a,n:x.n,cerr:x.c,curso:x.p,nada:x.z,venc:x.v,foto:x.f,reprog:x.r,
            avance:x.s/x.n*100,pctFoto:x.f/x.n*100};
  }).sort(function(x,y){return y.avance-x.avance;});
}

function vencidasList(){
  var hoy=hoyISO();
  return (AREA?M.filter(function(m){return m.area===AREA;}):M)
    .filter(function(m){var fc=(m.fechaCierre||'').substring(0,10);return fc&&fc<hoy&&m.pct<1;})
    .map(function(m){m._d=dias(m.fechaCierre.substring(0,10),hoy);return m;})
    .sort(function(a,b){return b._d-a._d;});
}

/* ================= render ================= */
function render(){
  limpiarCharts();
  var d=datos(), pa=porArea();
  var amb=AREA?('en '+AREA):'en las 16 áreas';

  /* --- banda de veredicto (hay meta declarada: 100 %) --- */
  var cls=semClase(d.avance), falta=META-d.avance;
  var titulo = cls==='ok' ? 'En meta' : (cls==='warn' ? 'Al límite' : 'Fuera de meta');
  var icono  = cls==='ok' ? '✓' : (cls==='warn' ? '!' : '!');
  var vcls   = cls==='ok' ? 'ok' : (cls==='warn' ? 'warn' : '');
  var abiertas=d.proc+d.nini;
  var frase='El avance '+amb+' es de <b>'+n1(d.avance)+'%</b> frente a la meta de '+META+'%: '+
            'faltan <b>'+n1(falta)+' puntos</b>, que equivalen a <b>'+abiertas+'</b> mejora'+
            (abiertas===1?'':'s')+' todavía sin cerrar de '+d.n+'.';

  /* --- KPIs --- */
  var pctCerr=d.n?d.cerr/d.n*100:0, pctFoto=d.n?d.conFoto/d.n*100:0;

  /* --- insight --- */
  var top=pa.slice(0,3), sumaTop=0; top.forEach(function(x){sumaTop+=x.cerr;});
  var peor=pa.slice(-1)[0];
  var ins;
  if(d.venc>0){
    ins='<b>Lo que más pesa:</b> '+d.venc+' mejoras ya pasaron la fecha que su área se comprometió a cumplir y siguen abiertas'+
        (peor&&!AREA?', y el área más rezagada es <b>'+esc(peor.area)+'</b>, con '+n1(peor.avance)+'% sobre '+peor.n+' ideas':'')+
        '. Si esas '+d.venc+' se cerraran, el avance global subiría a <b>'+
        n1(d.n?(d.suma+d.venc*0.5)/d.n*100:0)+'%</b> aproximadamente.';
  }else{
    ins='<b>Lo que más pesa:</b> solo '+n1(pctFoto)+'% de las ideas tiene evidencia cargada ('+d.conFoto+' de '+d.n+'). '+
        'Sin foto, que una mejora esté cerrada depende de lo que declara cada área.';
  }

  var areas=[''].concat(pa.map(function(x){return x.area;}));
  var sel='<select onchange="setArea(this.value)">'+areas.map(function(a){
    return '<option value="'+esc(a)+'"'+(a===AREA?' selected':'')+'>'+(a?esc(a):'Todas las áreas')+'</option>';}).join('')+'</select>';

  var h='';
  h+='<div class="bar"><label>Área</label>'+sel+
     '<span class="spacer"></span>'+
     '<span class="hstate">Meta declarada: '+META+'% de avance<br>Datos al abrir · '+new Date().toLocaleString('es-PE')+'</span></div>';

  h+='<div class="verdict '+vcls+'"><div class="dot">'+icono+'</div>'+
     '<div><div class="t">'+titulo+'</div><div class="s">'+frase+'</div></div></div>';

  h+='<div class="kpis">'+
    kpi(semKpi(d.avance), d.avance, 1, '%', 'Avance global', 'Suma de los avances ÷ '+d.n+' ideas · meta '+META+'%')+
    kpi('neu', d.n, 0, '', 'Ideas propuestas', 'Todas las del período, cerradas o no')+
    kpi(semKpi(pctCerr), d.cerr, 0, '', 'Cerradas', n1(pctCerr)+'% del total llegó al 100%')+
    kpi('warn', d.proc, 0, '', 'En curso', 'Entre 30% y 70% de avance')+
    kpi(d.venc?'alert':'', d.venc, 0, '', 'Con fecha vencida', 'Abiertas y con la fecha ya pasada')+
    kpi(semKpi(pctFoto), d.conFoto, 0, '', 'Con evidencia', n1(pctFoto)+'% · '+d.fotos+' archivos en total')+
  '</div>';

  h+='<div class="insight">'+ins+'</div>';

  h+='<div class="tabs">'+
     tb(0,'Panorama')+tb(1,'Áreas')+tb(2,'Riesgo')+tb(3,'Evidencia')+tb(4,'Detalle')+'</div>';
  /* los cinco paneles existen siempre en la página: así al imprimir salen todos */
  for(var t=0;t<5;t++)
    h+='<div class="tabpane'+(TAB===t?' active':'')+'" id="pane'+t+'">'+cuerpoTab(t)+'</div>';
  h+=guia();
  $('app').innerHTML=h;

  var vs=document.querySelectorAll('.kpi .v[data-count]');
  for(var i=0;i<vs.length;i++)countUp(vs[i]);

  LISTO={};
  dibujarTab(TAB);
}

function kpi(cls,valor,dec,suf,label,sub){
  return '<div class="kpi '+cls+'"><div class="l">'+label+'</div>'+
    '<div class="row"><span class="v" data-count="'+valor+'" data-dec="'+dec+'" data-suf="'+suf+'">0'+suf+'</span></div>'+
    '<div class="s">'+sub+'</div></div>';
}
function tb(i,txt){return '<button class="'+(TAB===i?'active':'')+'" onclick="setTab('+i+')">'+txt+'</button>';}
function setTab(i){
  TAB=i;
  var bs=document.querySelectorAll('.tabs button');
  for(var k=0;k<bs.length;k++)bs[k].classList.toggle('active',k===i);
  for(var p=0;p<5;p++){
    var el=$('pane'+p);
    if(el)el.classList.toggle('active',p===i);
  }
  dibujarTab(i);
}
function setArea(a){AREA=a;render();}

/* los gráficos se dibujan la primera vez que se ve la pestaña:
   un canvas oculto mide 0 y saldría deformado */
var LISTO={};
function dibujarTab(i){
  if(!LISTO[i]){pintarTab(i);LISTO[i]=true;}
  else for(var k=0;k<CHARTS.length;k++){try{CHARTS[k].resize();}catch(e){}}
}
/* al imprimir se despliegan las cinco */
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('beforeprint',function(){
    for(var t=0;t<5;t++){var el=$('pane'+t);if(el)el.classList.add('active');}
    for(var t2=0;t2<5;t2++)if(!LISTO[t2]){pintarTab(t2);LISTO[t2]=true;}
    for(var k=0;k<CHARTS.length;k++){try{CHARTS[k].resize();}catch(e){}}
  });
  window.addEventListener('afterprint',function(){
    for(var t=0;t<5;t++){var el=$('pane'+t);if(el)el.classList.toggle('active',t===TAB);}
  });
}

function panel(cls,t,sub,cuerpo){
  return '<div class="'+cls+'"><div class="panel"><div class="pt">'+t+'</div><div class="ph">'+sub+'</div>'+cuerpo+'</div></div>';
}
function lienzo(id,extra){return '<div class="cwrap '+(extra||'')+'"><canvas id="'+id+'"></canvas></div>';}

/* ================= pestañas ================= */
/* HTML de cada pestaña, sin gráficos */
function cuerpoTab(T){
  var d=datos(),pa=porArea();
  if(T===0){
    return '<div class="grid">'+
      panel('col8','Cómo está repartida cada área',
        'Cada barra es un área y suma 100%. Verde lo cerrado, ámbar lo que va en camino, gris lo que no arrancó. Mientras más gris, más lejos de la meta.',
        lienzo('cComp','xtall'))+
      panel('col4','Cerradas, en curso y sin empezar',
        'La misma información en proporción, sobre las '+d.n+' ideas mostradas.',
        lienzo('cDona','tall'))+
      panel('col12','En qué escalón están las '+d.n+' ideas',
        'Los cinco escalones que usa el Círculo, del que no ha empezado al que ya está entregado. La meta es que todas lleguen al 100%.',
        lienzo('cEsc'))+
      '</div>';
  }
  if(T===1){
    return '<div class="grid">'+
      panel('col6','Ranking de avance por área',
        'Porcentaje = suma de los avances de las ideas del área ÷ número de ideas de esa área. Nunca es el promedio de los porcentajes de otras áreas. Meta: '+META+'%.',
        '<ul class="rank">'+pa.map(function(x,i){
          return '<li><span class="n">'+(i+1)+'</span>'+
            '<div><div class="nm">'+esc(x.area)+' <span class="sub">· '+x.cerr+' de '+x.n+' cerradas'+
            (x.venc?' · '+x.venc+' vencidas':'')+'</span></div>'+
            '<div class="track"><i class="fill" data-w="'+x.avance.toFixed(1)+'" style="background:'+sem(x.avance)+'"></i></div></div>'+
            '<span class="val" style="color:'+sem(x.avance)+'">'+n1(x.avance)+'%</span></li>';
        }).join('')+'</ul>')+
      panel('col6','Cuántas ideas propone cada área frente a cuánto avanza',
        'Las barras son la cantidad de ideas; la línea es el avance del área. Muchas barras con línea baja significa que el área propone más de lo que alcanza a cerrar.',
        lienzo('cMix','tall'))+
      '</div>';
  }
  if(T===2){
    var v=vencidasList(), conV=pa.filter(function(x){return x.venc>0;});
    return '<div class="grid">'+
      (v.length?panel('col8','Las más atrasadas',
        'Días transcurridos desde la fecha que el área se comprometió a cumplir y no cumplió. Se muestran las 12 con más días.',
        lienzo('cAtraso','xtall'))
       :panel('col8','Sin mejoras vencidas','Ninguna mejora abierta tiene la fecha de cierre pasada.',''))+
      (conV.length?panel('col4','Vencidas por área',
        'Cuántas mejoras vencidas acumula cada área. Es la lista de a quién preguntarle primero.',
        lienzo('cVenc','xtall')):'')+
      panel('col12','Reprogramaciones',
        'Cuántas mejoras tuvieron que mover su fecha de cierre al menos una vez. Reprogramar varias veces suele indicar que la mejora está trabada, no que avanza despacio.',
        '<div class="dual">'+
        '<div class="dcell"><div class="dv">'+d.reprog+'</div><div class="dl">mejoras reprogramadas</div></div>'+
        '<div class="dcell"><div class="dv">'+(d.n?n1(d.reprog/d.n*100):0)+'%</div><div class="dl">del total de ideas</div></div>'+
        '</div>'+(d.reprog===0?'<div class="note">Todavía no hay reprogramaciones registradas. Este número empieza a contar desde ahora: las del archivo antiguo no quedaron guardadas.</div>':''))+
      '</div>';
  }
  if(T===3){
    return '<div class="grid">'+
      panel('col8','Qué tanto se documenta cada área',
        'Porcentaje de ideas del área con al menos un archivo cargado. Sin evidencia, que una mejora esté cerrada es solo una declaración.',
        lienzo('cFoto','xtall'))+
      panel('col4','Antes contra después',
        'Una evidencia sirve cuando se puede comparar. Si solo hay foto del resultado, no hay con qué contrastarla.',
        lienzo('cAD','tall')+
        (d.nDesp>d.nAntes*1.3?'<div class="note">Hay '+n1(d.nDesp/Math.max(d.nAntes,1))+' veces más archivos del después que del antes. Las áreas documentan el logro, casi nunca la situación previa.</div>':''))+
      '</div>';
  }
  var l=d.f.slice().sort(function(a,b){
    return a.area===b.area?a.id.localeCompare(b.id):a.area.localeCompare(b.area);});
  return '<div class="grid">'+panel('col12','Detalle de las '+l.length+' ideas',
    'La lista completa, por si hace falta buscar una mejora puntual.',
    '<input class="busca" type="search" placeholder="Buscar por código, área, idea o responsable…" oninput="filtraTabla(this.value)">'+
    '<div id="tw">'+tabla(l)+'</div>')+'</div>';
}

/* gráficos de cada pestaña */
function pintarTab(T){
  var d=datos(),pa=porArea();

  if(T===0){
    var lab=pa.map(function(x){return corto(x.area,20);});
    mk('cComp',{type:'bar',
      data:{labels:lab,datasets:[
        {label:'Cerradas',data:pa.map(function(x){return x.cerr/x.n*100;}),backgroundColor:C_CERR,borderRadius:4},
        {label:'En curso',data:pa.map(function(x){return x.curso/x.n*100;}),backgroundColor:C_CURSO,borderRadius:4},
        {label:'Sin empezar',data:pa.map(function(x){return x.nada/x.n*100;}),backgroundColor:C_NADA,borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,
        plugins:{tooltip:{callbacks:{label:function(x){
          var a=pa[x.dataIndex];
          var cant=x.datasetIndex===0?a.cerr:x.datasetIndex===1?a.curso:a.nada;
          return x.dataset.label+': '+cant+' de '+a.n+' ('+n1(x.raw)+'%)';}}}},
        scales:{x:{stacked:true,max:100,grid:{color:'#F1F6F4'},ticks:{callback:function(v){return v+'%';}}},
                y:{stacked:true,grid:{display:false}}}}});

    mk('cDona',{type:'doughnut',
      data:{labels:['Cerradas','En curso','Sin empezar'],
        datasets:[{data:[d.cerr,d.proc,d.nini],backgroundColor:[C_CERR,C_CURSO,C_NADA],borderWidth:0}]},
      options:{responsive:true,cutout:'74%',
        plugins:{tooltip:{callbacks:{
          label:function(x){return x.label+': '+x.raw+' ideas ('+n1(d.n?x.raw/d.n*100:0)+'%)';}}}}}});

    var cnt=ESCALA.map(function(e){return d.f.filter(function(m){return Math.abs(m.pct-e.p)<0.001;}).length;});
    mk('cEsc',{type:'bar',
      data:{labels:ESCALA.map(function(e){return Math.round(e.p*100)+'%';}),
        datasets:[{data:cnt,backgroundColor:COL_ESC,borderRadius:4}]},
      options:{responsive:true,
        plugins:{legend:{display:false},tooltip:{callbacks:{
          title:function(x){return ESCALA[x[0].dataIndex].c;},
          label:function(x){return x.raw+' ideas ('+n1(d.n?x.raw/d.n*100:0)+'%)';}}}},
        scales:{y:{beginAtZero:true,grid:{color:'#F1F6F4'},title:{display:true,text:'Cantidad de ideas'}},
                x:{grid:{display:false}}}}});
  }

  if(T===1){
    setTimeout(function(){
      var f=document.querySelectorAll('.rank .fill');
      for(var i=0;i<f.length;i++)f[i].style.width=f[i].dataset.w+'%';
    },120);

    mk('cMix',{data:{labels:pa.map(function(x){return corto(x.area,14);}),
      datasets:[
        {type:'bar',label:'Ideas propuestas',data:pa.map(function(x){return x.n;}),
         backgroundColor:'#DCE5E2',borderRadius:4,order:2,yAxisID:'y'},
        {type:'bar',label:'Ideas cerradas',data:pa.map(function(x){return x.cerr;}),
         backgroundColor:C_CERR,borderRadius:4,order:1,yAxisID:'y'},
        {type:'line',label:'Avance del área',data:pa.map(function(x){return x.avance;}),
         borderColor:C_AZUL,backgroundColor:C_AZUL,borderWidth:2.5,pointRadius:4,
         pointBorderColor:'#fff',tension:.3,order:0,yAxisID:'y1'},
        {type:'line',label:'Meta '+META+'%',data:pa.map(function(){return META;}),
         borderColor:'#F59E0B',borderDash:[6,5],borderWidth:2,pointRadius:0,order:0,yAxisID:'y1'}]},
      options:{responsive:true,
        plugins:{tooltip:{callbacks:{label:function(x){
          return x.dataset.type==='line'? x.dataset.label+': '+n1(x.raw)+'%' : x.dataset.label+': '+x.raw;}}}},
        scales:{y:{beginAtZero:true,position:'left',grid:{color:'#F1F6F4'},title:{display:true,text:'Ideas'}},
                y1:{beginAtZero:true,max:100,position:'right',grid:{display:false},
                    ticks:{callback:function(v){return v+'%';}},title:{display:true,text:'Avance'}},
                x:{grid:{display:false},ticks:{maxRotation:60,minRotation:45}}}}});
  }

  if(T===2){
    var v=vencidasList(),top=v.slice(0,12);
    var conV=pa.filter(function(x){return x.venc>0;});
    if(v.length) mk('cAtraso',{type:'bar',
      data:{labels:top.map(function(m){return m.id+' · '+corto(m.idea,32);}),
        datasets:[{data:top.map(function(m){return m._d;}),
          backgroundColor:top.map(function(m){return sem(m.pct*100);}),borderRadius:4,barThickness:16}]},
      options:{indexAxis:'y',responsive:true,layout:{padding:{right:44}},
        plugins:{legend:{display:false},etiquetaBarra:{on:true,dec:0,suf:' d'},
          tooltip:{callbacks:{
          label:function(x){return x.raw+' días vencida · avance '+Math.round(top[x.dataIndex].pct*100)+'%';}}}},
        scales:{x:{beginAtZero:true,grid:{color:'#F1F6F4'},title:{display:true,text:'Días de atraso'}},
                y:{grid:{display:false},ticks:{font:{size:10.5}}}}}});

    if(conV.length) mk('cVenc',{type:'bar',
      data:{labels:conV.map(function(x){return corto(x.area,20);}),
        datasets:[{data:conV.map(function(x){return x.venc;}),
          backgroundColor:conV.map(function(x){return sem(x.avance);}),borderRadius:4,barThickness:16}]},
      options:{indexAxis:'y',responsive:true,layout:{padding:{right:36}},
        plugins:{legend:{display:false},etiquetaBarra:{on:true,dec:0},
          tooltip:{callbacks:{
          label:function(x){return x.raw+' vencidas de '+conV[x.dataIndex].n+' ideas · avance '+n1(conV[x.dataIndex].avance)+'%';}}}},
        scales:{x:{beginAtZero:true,grid:{color:'#F1F6F4'},ticks:{precision:0}},y:{grid:{display:false}}}}});
  }

  if(T===3){
    mk('cFoto',{type:'bar',
      data:{labels:pa.map(function(x){return corto(x.area,20);}),
        datasets:[{data:pa.map(function(x){return x.pctFoto;}),
          backgroundColor:pa.map(function(x){return sem(x.pctFoto);}),borderRadius:4,barThickness:16}]},
      options:{indexAxis:'y',responsive:true,layout:{padding:{right:46}},
        plugins:{legend:{display:false},etiquetaBarra:{on:true,dec:1,suf:'%'},
          tooltip:{callbacks:{
          label:function(x){return pa[x.dataIndex].foto+' de '+pa[x.dataIndex].n+' ideas con evidencia ('+n1(x.raw)+'%)';}}}},
        scales:{x:{beginAtZero:true,max:100,grid:{color:'#F1F6F4'},ticks:{callback:function(v){return v+'%';}}},
                y:{grid:{display:false}}}}});

    mk('cAD',{type:'bar',
      data:{labels:['Del antes','Del después'],
        datasets:[{data:[d.nAntes,d.nDesp],backgroundColor:[C_AZUL,C_CERR],borderRadius:4,barThickness:56}]},
      options:{responsive:true,
        plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,grid:{color:'#F1F6F4'},title:{display:true,text:'Archivos'}},
                x:{grid:{display:false}}}}});
  }

}

function filtraTabla(q){
  q=(q||'').toLowerCase();
  var fs=document.querySelectorAll('#tw tbody tr');
  for(var i=0;i<fs.length;i++){
    fs[i].style.display = fs[i].textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none';
  }
}

function tabla(l){
  var ids={};E.forEach(function(x){ids[x.idMejora]=(ids[x.idMejora]||0)+1;});
  var hoy=hoyISO();
  return '<div style="overflow-x:auto"><table><thead><tr>'+
    '<th>Código</th><th>Área</th><th>Idea de mejora</th><th>Avance</th><th>Fecha de cierre</th><th>Archivos</th>'+
    '</tr></thead><tbody>'+l.map(function(m){
      var fc=(m.fechaCierre||'').substring(0,10);
      var v=fc&&fc<hoy&&m.pct<1;
      var rp=(m.vecesReprog||0);
      return '<tr><td><b>'+esc(m.id)+'</b></td><td>'+esc(m.area)+'</td><td>'+esc(m.idea)+'</td>'+
      '<td><span class="pill '+semClase(m.pct*100)+'">'+Math.round(m.pct*100)+'%</span>'+
      (m.revisar==='SI'?' <span class="pill neu">revisar</span>':'')+'</td>'+
      '<td>'+(fc?esc(fc):'<span class="gris">—</span>')+(v?' <span class="pill bad">vencida</span>':'')+
      (rp?'<div style="font-size:10.5px;color:#8A6100">reprogramada '+rp+'×</div>':'')+'</td>'+
      '<td>'+(ids[m.id]||0)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function guia(){
  return '<details class="help"><summary>¿Cómo leo este tablero?</summary><dl>'+
  '<dt>Círculo de Mejoras</dt><dd>Reunión semanal en la que cada una de las 16 áreas propone ideas para mejorar su propio trabajo, y se les hace seguimiento hasta cerrarlas.</dd>'+
  '<dt>Avance global</dt><dd>Se suma el avance de cada idea (0 · 0.3 · 0.5 · 0.7 · 1) y se divide entre la cantidad de ideas. Una idea al 50% aporta la mitad que una cerrada. No se promedian los porcentajes de las áreas entre sí.</dd>'+
  '<dt>Meta y semáforo</dt><dd>La meta es <b>'+META+'%</b>: que toda mejora propuesta termine cerrada. Verde en meta ('+META+'%), ámbar entre '+(META*0.8)+'% y '+META+'%, rojo por debajo de '+(META*0.8)+'%. Aquí subir es bueno, al revés que en indicadores de rechazo.</dd>'+
  '<dt>Los cinco escalones</dt><dd>0% no iniciado · 30% solicitud realizada · 50% pedido en gestión · 70% confirmado por el proveedor · 100% entregado o implementado. Es la misma escala que ya se usaba en los archivos de cumplimiento de cada área.</dd>'+
  '<dt>Fecha vencida</dt><dd>En la reunión el área dice para cuándo estará lista la mejora. Si esa fecha ya pasó y la mejora sigue abierta, cuenta como vencida.</dd>'+
  '<dt>Reprogramada</dt><dd>Cuántas veces se movió la fecha comprometida. Reprogramar varias veces suele indicar que la mejora está trabada, no que avanza despacio.</dd>'+
  '<dt>Con evidencia</dt><dd>Ideas con al menos una foto o archivo cargado. Es la única forma de verificar que la mejora se ejecutó y no solo se declaró cerrada.</dd>'+
  '<dt>Exclusiones</dt><dd>Ninguna. Entran las 630 ideas migradas del archivo Excel más las que se registren desde el panel. Las que llegaron sin estado se cargaron en 0%, así que el avance real podría ser algo mayor que el mostrado.</dd>'+
  '<dt>¿De dónde salen los datos?</dt><dd>Del Google Sheet que se actualiza desde el panel de gestión. Esta página lo vuelve a leer cada vez que se abre o se refresca.</dd>'+
  '</dl></details>';
}
window.setTab=setTab;window.setArea=setArea;window.filtraTabla=filtraTabla;window.cargarDatos=cargarDatos;

cargarDatos();
</script>
